<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OS LESADOS — HTML Único</title>
  <style>
    :root {
      --primary: #ff006e;
      --secondary: #8338ec;
      --dark: #0f0f1a;
      --darker: #05050a;
      --success: #00c853;
      --warning: #ffab00;
      --danger: #ff1744;
      --canon: #ffd700;
      --border: #2a2a4a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--dark);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1700px;
      margin: 0 auto;
      background: var(--darker);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .header {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(1000px 200px at 20% -40px, rgba(255,0,110,.45), transparent 60%),
        radial-gradient(900px 220px at 85% -30px, rgba(131,56,236,.55), transparent 60%),
        linear-gradient(90deg, #2b0a2e, #12071f 55%, #0a0a18);
      padding: 26px 20px 0;
      border-bottom: 3px solid var(--canon);
      box-shadow: 0 0 24px rgba(255,215,0,.25), inset 0 -18px 40px rgba(0,0,0,.5);
      text-align: center;
    }
    .header::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px);
    }
    .header h1 { color: #fff; font-size: 2.4em; letter-spacing: 8px; text-transform: uppercase; text-shadow: 0 0 18px rgba(255,0,110,.8), 0 2px 0 #000; position: relative; }
    .header h1::after { content: ""; display: block; width: 220px; height: 3px; margin: 10px auto 0; background: linear-gradient(90deg, transparent, var(--canon), transparent); box-shadow: 0 0 12px var(--canon); }
    .header p { color: rgba(255,255,255,.9); margin-top: 8px; font-size: .95em; position: relative; }
    .live-badge { position: absolute; top: 14px; right: 16px; display: flex; align-items: center; gap: 7px; background: #000; border: 1px solid var(--danger); color: #fff; font-weight: 800; font-size: .72em; letter-spacing: 2px; padding: 6px 12px; border-radius: 20px; box-shadow: 0 0 14px rgba(255,23,68,.7); z-index: 2; }
    .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--danger); } 50% { opacity: .25; box-shadow: none; } }
    .ticker { margin: 14px -20px 0; background: #000; border-top: 1px solid var(--canon); border-bottom: 1px solid var(--canon); overflow: hidden; white-space: nowrap; position: relative; }
    .ticker-inner { display: inline-block; padding: 7px 0; font-family: "Courier New", monospace; font-size: .78em; font-weight: 700; letter-spacing: 1px; color: var(--canon); animation: tick 28s linear infinite; }
    @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .epnav { position: relative; display: flex; gap: 14px; align-items: stretch; justify-content: center; flex-wrap: wrap; margin: 12px auto 14px; padding: 10px 18px; width: fit-content; max-width: 96%; background: rgba(0,0,0,.5); border: 1px solid rgba(255,215,0,.4); border-radius: 14px; box-shadow: 0 0 18px rgba(255,215,0,.15), inset 0 1px 0 rgba(255,255,255,.06); backdrop-filter: blur(4px); }
    .epnav-group { display: flex; align-items: center; gap: 9px; }
    .epnav-kicker { font-size: .62em; letter-spacing: 2.5px; color: var(--canon); font-weight: 800; text-transform: uppercase; text-shadow: 0 0 8px rgba(255,215,0,.5); }
    .epnav-select-wrap { position: relative; display: inline-block; }
    .epnav-select-wrap::after { content: "▾"; position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--canon); pointer-events: none; font-size: .8em; }
    .epnav select { appearance: none; -webkit-appearance: none; background: linear-gradient(180deg, #1c1c34, #0f0f1a); border: 1px solid rgba(255,255,255,.18); color: #fff; border-radius: 9px; padding: 8px 30px 8px 12px; font-family: inherit; font-size: .85em; font-weight: 700; max-width: 300px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .epnav select:hover { border-color: var(--primary); }
    .epnav select:focus { outline: none; border-color: var(--canon); box-shadow: 0 0 12px rgba(255,215,0,.45); }
    .epnav select option { background: #0f0f1a; font-weight: 400; }
    .epnav-divider { width: 1px; background: linear-gradient(transparent, rgba(255,215,0,.45), transparent); }
    .epnav-meta { align-self: center; font-size: .72em; font-weight: 800; letter-spacing: 1px; color: #000; background: linear-gradient(90deg, var(--canon), #ffe97a); padding: 6px 14px; border-radius: 20px; box-shadow: 0 0 12px rgba(255,215,0,.5); white-space: nowrap; }
    .epnav-empty { font-size: .8em; color: rgba(255,255,255,.7); font-style: italic; }
    .layout { display: grid; grid-template-columns: 360px 1fr; min-height: 85vh; }
    .sidebar { background: #151525; border-right: 1px solid var(--border); padding: 18px; overflow-y: auto; max-height: 85vh; }
    .content { padding: 22px; overflow-y: auto; max-height: 85vh; }
    .title { color: var(--warning); font-size: .95em; text-transform: uppercase; font-weight: 800; margin: 18px 0 10px; border-bottom: 1px solid var(--secondary); padding-bottom: 6px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 6px; color: #a0a0c0; font-size: .82em; font-weight: 700; }
    .field input, .field textarea, .field select {
      width: 100%; background: #0f0f1a; border: 1px solid var(--border); color: #fff; border-radius: 6px; padding: 10px; font-family: inherit; font-size: .9em;
    }
    .field textarea { min-height: 90px; resize: vertical; }
    .btn {
      width: 100%; border: none; border-radius: 6px; padding: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; color: #fff;
      background: linear-gradient(90deg, var(--primary), var(--secondary)); margin-bottom: 8px;
    }
    .btn:hover { opacity: .92; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-sm { padding: 9px 10px; font-size: .82em; }
    .reference-guide { margin: 12px 0 14px; padding: 12px; border: 1px solid rgba(255,255,255,.14); border-radius: 9px; background: rgba(255,255,255,.035); }
    .reference-guide-title { font-size: .78em; color: var(--canon); font-weight: 900; letter-spacing: .7px; text-transform: uppercase; margin-bottom: 8px; }
    .reference-guide-note { color: #b9b9ce; font-size: .78em; line-height: 1.5; margin-bottom: 10px; }
    .reference-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .reference-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); color: #fff; font-size: .76em; font-weight: 850; box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
    .reference-chip::before { content: "REF"; font-size: .68em; letter-spacing: .6px; background: rgba(0,0,0,.25); padding: 3px 5px; border-radius: 5px; }
    .reference-empty { font-size: .8em; color: #a0a0c0; padding: 8px 0; }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-success { background: var(--success); color: #000; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: #2d2b55; border: 1px solid var(--secondary); color: #d7c7ff; }
    .box { background: #1a1a30; border: 1px solid var(--secondary); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
    .hint { color: #888; font-size: .78em; line-height: 1.35; margin-top: 6px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-bottom: 18px; }
    .tab { padding: 10px 16px; border: 1px solid var(--border); background: #151525; color: #a0a0c0; border-radius: 6px 6px 0 0; cursor: pointer; font-weight: 700; font-size: .88em; }
    .tab.active { background: var(--secondary); color: #fff; border-color: var(--secondary); }
    .pane { display: none; }
    .pane.active { display: block; }
    .empty { text-align: center; padding: 60px 20px; color: #666; }
    .empty h3 { color: var(--warning); margin-bottom: 8px; }
    .status, .api-status, .audit { padding: 10px; border-radius: 6px; margin-top: 10px; font-size: .85em; line-height: 1.4; }
    .status.info, .api-status.testing, .audit.warning { background: #1a1a30; border: 1px solid var(--warning); color: #ffe08a; }
    .status.success, .api-status.success, .audit.success { background: #051a0a; border: 1px solid var(--success); color: #7dffb0; }
    .status.error, .api-status.error, .audit.error, .audit.critical { background: #1a0505; border: 1px solid var(--danger); color: #ff9aa8; }
    .script {
      background: #fdfdf5; color: #111; font-family: "Courier New", monospace; font-size: 12.5px; line-height: 1.55;
      padding: 45px 55px; border-radius: 8px; max-width: 900px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,.3);
    }
    .script-head { text-align: center; border-bottom: 2px solid #999; padding-bottom: 16px; margin-bottom: 28px; }
    .script-head h2 { text-transform: uppercase; text-decoration: underline; margin-bottom: 6px; }
    .act { text-align: center; font-weight: 800; text-transform: uppercase; margin: 28px 0 16px; padding: 8px 0; border-top: 2px solid #999; border-bottom: 2px solid #999; letter-spacing: 2px; }
    .slug { font-weight: 800; text-transform: uppercase; margin: 22px 0 10px; }
    .camera { font-style: italic; color: #333; background: #ececdc; padding: 7px 10px; border-radius: 4px; margin: 8px 0; font-size: .92em; }
    .take { display: inline-block; background: #000; color: #00ff88; padding: 4px 9px; border-radius: 3px; font-size: .85em; font-weight: 800; margin: 10px 0 6px; }
    .action { margin: 8px 0 12px; }
    .char { text-align: center; text-transform: uppercase; font-weight: 800; margin: 14px 0 2px; }
    .paren { text-align: center; font-style: italic; margin-bottom: 2px; }
    .dialogue { text-align: center; margin: 0 0 12px; padding: 0 110px; }
    .reversal { text-align: center; font-style: italic; color: #8a0000; background: #fff3f3; border: 1px solid #ffcfcf; padding: 6px; border-radius: 4px; margin: 10px 0; font-size: .9em; }
    .reframe { font-style: italic; color: #666; background: #f1f1e5; border-left: 3px solid #999; padding: 6px 10px; margin: 8px 0; font-size: .88em; }
    .cut { text-align: right; font-weight: 800; text-transform: uppercase; margin: 16px 0; }
    .narr { background: #fff8e1; border: 2px dashed #b36a00; border-radius: 6px; padding: 12px 16px; margin: 18px 0; font-size: .92em; }
    .narr strong { color: #8a5200; }
    .timecard { background: #000; color: #fff; text-align: center; font-family: Georgia, serif; letter-spacing: 4px; text-transform: uppercase; padding: 22px 10px; margin: 24px 0; border-radius: 4px; font-size: 1.05em; }
    .transit { background: linear-gradient(90deg, #2b0a2e, #1a1a30); border-left: 4px solid var(--primary); border-radius: 4px; padding: 9px 14px; margin: 14px 0; font-size: .85em; color: #ffd7ea; }
    .transit strong { color: var(--primary); }
    .end { text-align: center; font-weight: 800; margin-top: 34px; letter-spacing: 2px; }
    .summary { background: #1a1a30; border: 2px solid var(--canon); border-radius: 8px; padding: 18px; margin-bottom: 18px; }
    .summary h3 { color: var(--canon); margin-bottom: 12px; }
    .grid-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .card-mini { background: #0f0f1a; border-radius: 6px; padding: 12px; }
    .label { color: var(--warning); font-size: .76em; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
    .value { color: #e0e0e0; font-size: .92em; line-height: 1.35; }
    .synopsis { background: #0f0f1a; border-left: 3px solid var(--canon); border-radius: 6px; padding: 14px; }
    .pipeline { display: grid; grid-template-columns: 240px 1fr; gap: 18px; }
    .nav { background: #151525; border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .season { background: #1a1a30; border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
    .season-title { color: var(--canon); font-weight: 800; margin-bottom: 8px; }
    .ep-list { display: flex; flex-direction: column; gap: 6px; }
    .ep-item { background: #0f0f1a; padding: 8px 10px; border-radius: 4px; font-size: .85em; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .ep-item.active { background: var(--secondary); color: #fff; }
    .ep-del { color: #888; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
    .ep-del:hover { color: #fff; background: var(--danger); }
    .gen { background: #151525; border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 18px; }
    .gen h3 { color: var(--warning); margin-bottom: 10px; }
    .prompt { width: 100%; min-height: 120px; background: #0f0f1a; border: 1px solid var(--border); color: #fff; border-radius: 6px; padding: 12px; font-family: "Courier New", monospace; font-size: .84em; resize: vertical; margin-bottom: 12px; }
    .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .buttons .btn { flex: 1; min-width: 150px; margin-bottom: 0; }
    .preview { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 2px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .preview img { width: 100%; height: 100%; object-fit: contain; }
    .preview .ph { color: #555; font-size: .9em; }
    .scenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .scene { background: #151525; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; }
    .scene:hover { border-color: var(--primary); transform: translateY(-2px); }
    .scene.selected { border-color: var(--canon); box-shadow: 0 0 14px rgba(255,215,0,.25); }
    .scene-img { width: 100%; aspect-ratio: 16 / 9; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .scene-img img { width: 100%; height: 100%; object-fit: cover; }
    .scene-img .none { color: #555; font-size: .8em; }
    .scene-info { padding: 10px; }
    .scene-title { color: var(--canon); font-weight: 800; font-size: .88em; margin-bottom: 4px; }
    .scene-desc { color: #a0a0c0; font-size: .73em; line-height: 1.3; }
    .badge { background: var(--danger); color: #fff; padding: 2px 6px; border-radius: 3px; font-size: .68em; font-weight: 800; margin-left: 5px; }
    .badge-ok { background: var(--success); color: #000; padding: 2px 6px; border-radius: 3px; font-size: .68em; font-weight: 800; margin-left: 5px; }
    .meta { color: #888; font-size: .68em; margin-top: 6px; line-height: 1.25; }
    .vtable { width: 100%; border-collapse: collapse; font-size: .82em; }
    .agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .agent { background: #151525; border: 1px solid var(--border); border-radius: 8px; padding: 12px; position: relative; }
    .agent.active { border-color: var(--warning); box-shadow: 0 0 12px rgba(255,171,0,.3); }
    .agent.done { border-color: var(--success); }
    .agent.failed { border-color: var(--danger); }
    .agent h4 { font-size: .9em; margin-bottom: 2px; }
    .agent .role { color: #a0a0c0; font-size: .72em; margin-bottom: 8px; }
    .st { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: .68em; font-weight: 800; text-transform: uppercase; background: #2d2b55; color: #d7c7ff; }
    .st.run { background: #4a3200; color: #ffd54d; animation: blink 1.2s ease-in-out infinite; }
    .st.ok { background: #051a0a; color: #7dffb0; border: 1px solid var(--success); }
    .st.err { background: #1a0505; color: #ff9aa8; border: 1px solid var(--danger); }
    .feed { background: #0f0f1a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; max-height: 260px; overflow-y: auto; font-size: .8em; line-height: 1.5; margin-bottom: 14px; }
    .feed .msg { margin-bottom: 7px; padding-bottom: 7px; border-bottom: 1px dotted #2a2a4a; }
    .flow { display: inline-block; background: #2d2b55; color: #fff; border-radius: 4px; padding: 1px 7px; font-weight: 800; font-size: .75em; }
    .flow small { color: #a0a0c0; font-weight: 400; }
    .src { font-size: .78em; color: #a0a0c0; margin-bottom: 5px; }
    .src a { color: #7dffb0; }
    .props { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .prop { background: #151525; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .prop.short { border-color: var(--canon); box-shadow: 0 0 10px rgba(255,215,0,.2); }
    .prop.dead { opacity: .55; }
    .prop h4 { color: var(--canon); font-size: .92em; margin-bottom: 6px; }
    .prop p { font-size: .8em; line-height: 1.45; color: #c0c0e0; margin: 4px 0; }
    .prop .kw { color: var(--warning); font-weight: 800; font-size: .72em; text-transform: uppercase; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
    .habbo-room { position: relative; height: 230px; border-radius: 10px; overflow: hidden; margin-bottom: 14px;
      background: linear-gradient(180deg, #2b1a4e 0 38%, #3d2b63 38% 40%, #4a3670 40% 100%);
      border: 1px solid var(--border); }
    .habbo-room::before { content: ""; position: absolute; inset: 40% 0 0 0;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 24px, transparent 24px 48px),
                  repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 24px); }
    .habbo-room .door { position: absolute; left: 46%; top: 8%; width: 60px; height: 74px; background: #12071f; border: 2px solid var(--canon); border-radius: 30px 30px 4px 4px; }
    .habbo { position: absolute; --px: 4px; width: calc(var(--px) * 10); height: calc(var(--px) * 15); animation: habboBob 2.4s ease-in-out infinite; }
    .habbo .px { position: absolute; left: 0; top: 0; width: var(--px); height: var(--px); }
    .habbo .tag { position: absolute; top: calc(var(--px) * -7); left: 50%; transform: translateX(-50%); white-space: nowrap;
      font-size: .62em; font-weight: 800; background: rgba(0,0,0,.65); color: #fff; padding: 1px 7px; border-radius: 8px; }
    .habbo .bub { position: absolute; top: calc(var(--px) * -13); left: 60%; font-size: 1em; animation: habboBob 1s ease-in-out infinite; }
    .habbo.work { animation-duration: 1s; }
    .habbo.done .px { filter: drop-shadow(0 0 5px #00c853); }
    .habbo.failed .px { filter: drop-shadow(0 0 5px #ff1744); }
    @keyframes habboBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (max-width: 600px) { .habbo { --px: 3px; } .habbo-room { height: 190px; } }
    .vtable th, .vtable td { border: 1px solid var(--border); padding: 10px; vertical-align: top; text-align: left; }
    .vtable th { background: #151525; color: var(--canon); text-transform: uppercase; font-size: .75em; }
    .vtable td.thumb img { width: 160px; border-radius: 4px; }
    .archive-script-view { margin-top: 14px; }
    .archive-script { white-space: pre-wrap; overflow-wrap: anywhere; display: block; background: #fdfdf5; color: #111; padding: 24px; border-radius: 8px; line-height: 1.55; font: 13px/1.55 "Courier New", monospace; max-height: 72vh; overflow: auto; }
    .vprompt { white-space: pre-wrap; font-family: "Courier New", monospace; font-size: .78em; line-height: 1.45; background: #0f0f1a; border-radius: 6px; padding: 10px; max-height: 280px; overflow-y: auto; margin: 0; }
    .vnote { font-size: .78em; line-height: 1.4; background: #1a1a30; border: 1px dashed var(--warning); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; color: #ffe08a; }
    .bible { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .char-card { background: #151525; border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .char-card h3 { color: var(--canon); margin-bottom: 8px; font-size: 1em; }
    .char-card p { font-size: .86em; line-height: 1.45; margin: 6px 0; color: #c0c0e0; }
    .char-card strong { color: var(--warning); }
    .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 6px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 1024px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
      .pipeline { grid-template-columns: 1fr; }
      .script { padding: 28px 18px; }
      .dialogue { padding: 0 28px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="live-badge"><span class="live-dot"></span> NO AR</div>
      <h1>OS LESADOS</h1>
      <div class="ticker"><span class="ticker-inner" id="tickerText"></span></div>
      <div class="epnav" id="epNav"></div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="box">
          <div class="title" style="margin-top:0;border:0;padding:0;">Sugestão</div>
          <div id="suggestionTitle" style="font-weight:800;color:var(--canon);font-size:.9em;margin-bottom:4px;">Clica para gerar ideia.</div>

    const TC_INCIDENTE = ["ENTRETANTO, NO DIRETO…", "SEGUNDOS DEPOIS, NO PLATEAU…", "NO AR EM 30 SEGUNDOS…", "ENQUANTO ISSO, NA RÉGIE…"];
    const TC_BASTIDOR = ["NO CAMARIM, AO MESMO TEMPO…", "NOS BASTIDORES…", "LONGE DAS CÂMARAS…", "ATRÁS DO CENÁRIO…"];
    const TC_FINAL = ["DOIS MINUTOS DEPOIS…", "DE VOLTA AO DIRETO…", "PARA ENCERRAR…", "ANTES DO GENÉRICO…"];
    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
    // Cold opens de localização: alguns episódios abrem com o exterior/hall
    // em zoom in antes do estúdio (metragem de biblioteca, não se gera).
    const COLD_OPENS = [
      { location: "Exterior TVI (transição, sempre zoom in)", camera: "SLOW ZOOM IN", duration: 3, action: "Placar exterior com o logo. Zoom in lento até à entrada. Sempre zoom in." },
      { location: "Hall TVI (receção)", camera: "SLOW ZOOM IN", duration: 3, action: "Hall vazio ao amanhecer. Zoom in lento até ao balcão da receção." },

    ];
    function pickColdOpen(premise, number) {
      const low = String(premise || "").toLowerCase();
      const has = (...ws) => ws.some(w => low.includes(w));
      if (has("rua", "exterior", "chegada", "estação", "estacao", "placar")) return COLD_OPENS[0];
      if (has("hall", "receção", "rececao", "visita", "gala", "chega")) return COLD_OPENS[1];

    // Transição entre dois cenários, como na TV real (escolhida pelo destino).

    // Guiões canónicos guardados no repositório, independentes do localStorage do Pipeline.
    let REPO_EPISODES = [{"number":1,"title":"A Rainha dos Reality-Shows","status":"Em desenvolvimento","path":"Temporadas/Temporada-1/episodio-01-a-rainha-dos-reality-shows.md","content":"# Episódio 1 — A Rainha dos Reality-Shows\n\n**Estado:** Em desenvolvimento  \n**Aprovado:** abertura nos torniquetes; frase central de Teresa; saída com reconhecimento de um fã.  \n**Pendente:** fechar e aprovar o diálogo completo do gabinete, incluindo a entrada da Tininha.\n\n## Premissa\n\nTeresa Guilhermina I de Portugal regressa à TVI convencida de que o seu legado lhe garante um lugar no Secret Story. O Capitão Gancho não lhe oferece o lugar que procura. Tininha entra no gabinete e representa a nova ordem da estação. Teresa sai humilhada, mas sem perder a classe, e o grito de um fã devolve-lhe parte da confiança.\n\n## Abertura aprovada — manter sem alterações\n\n**INT. RECEÇÃO DA TVI — DIA**\n\n**RECECIONISTA:** Bom dia. Tem marcação?\n\n**TERESA:** Tem marcação?! Eu sou a Rainha dos Reality-Shows! Está a brincar comigo?!\n\nTeresa vê os torniquetes eletrónicos onde os funcionários passam os cartões. Sem hesitar, salta por cima deles.\n\n**TERESA:** Aprenda. A realeza não passa cartões.\n\nA rececionista pega no telefone, sem grande reação.\n\n**RECECIONISTA:** Segurança? Temos aqui uma senhora que saltou os torniquetes.\n\nTeresa continua a andar pelo corredor.\n\n**TERESA:** NÃO SOU UMA SENHORA! SOU A HISTÓRIA DA TELEVISÃO!\n\n## Gabinete do Capitão Gancho\n\n**INT. GABINETE DO CAPITÃO GANCHO — DIA**\n\nTeresa chega à porta. Plano aproximado da placa com o nome **CAPITÃO GANCHO**. Entra com a segurança de quem considera que ainda pertence àquele lugar.\n\nA confrontação deve estabelecer que Teresa quer regressar ao Secret Story como apresentadora, enquanto o Capitão Gancho mantém a decisão e não lhe oferece um lugar. O Capitão é frio, prático e autoritário; não grita nem recorre constantemente a piadas de pirata.\n\nTininha entra durante a discussão, com uma pasta, e demonstra com naturalidade que já ocupa uma posição de poder. A sua provocação deve ser subtil e institucional. **Tininha não trata Teresa por “querida”.** O diálogo exato desta troca ainda está por fechar.\n\n### Frase de Teresa aprovada\n\n**TERESA:** Pode tirar-me o lugar, Capitão. Não pode apagar aquilo que eu fiz nesta estação.\n\nEsta frase deve ficar no confronto, depois de ficar claro que o Capitão não lhe vai dar o lugar que procura.\n\n## Saída — final aprovado\n\n**INT. CORREDOR DA TVI — CONTÍNUO**\n\nTeresa sai do gabinete de cabeça erguida, recompõe a roupa e ajeita a coroa. Caminha pelo corredor sem demonstrar a humilhação que acabou de sofrer.\n\nUm fã que está no corredor reconhece-a e grita, emocionado:\n\n**FÃ:** TERESA, VOLTE!!\n\nTeresa para por um instante. Sorri discretamente, faz um pequeno aceno real e retoma a marcha, agora com satisfação renovada.\n\n**TERESA:** Há quem nunca se esqueça.\n\nCorte para preto.\n\n## Regras de continuidade\n\n- Não alterar a abertura aprovada dos torniquetes.\n- Teresa usa a sua aparência habitual, sem peruca.\n- Manter consistentes os cenários e os ângulos já existentes do hall, corredor e gabinete.\n- A saída é elegante: Teresa sente-se humilhada pela decisão, mas continua convencida do valor do seu legado.\n- O final do fã é aprovado; o guião completo continua em desenvolvimento até ser aprovado explicitamente.\n","kind":"guião"},{"number":2,"title":"Roda Capitão","status":"Guião em revisão · texto integral por consolidar","path":"Temporadas/Temporada-1/episodio-02-roda-capitao.md","content":"# Episódio 2 — Roda Capitão\n\n**Estado:** guião em revisão; texto integral por consolidar  \n**Tipo:** ficha de continuidade para recuperar a versão aprovada antes de storyboard e animação.\n\n## Premissa e conflito\n\nO episódio centra-se no confronto entre Capitão Gancho e Tininha. Teresa Guilhermina não participa nesse confronto: só deve aparecer no final, numa cena separada que funciona como remate e deixa aberta a continuação da intriga.\n\n## Continuidade obrigatória\n\n- **Teresa fica fora do confronto Gancho/Tininha.** A sua única aparição neste episódio é no final.\n- **Abelha Maia não é narradora automática.** Só aparece se a história precisar dela; não acrescentar abertura ou fecho em voz-off por rotina.\n- Evitar a palavra **«pivot»** sem contexto. Reformular em português claro, adequado à situação televisiva.\n- A métrica **«0,3»** não pode surgir isolada. Se for importante para a piada, explicar a que se refere e em que unidade/escala é medida; caso contrário, retirar.\n- Preservar a indicação de remate recebida: **«Acabado. Tininha — madrugada. Guilhermina — a porta.»** Não transformar esta nota em diálogo nem alterar o seu sentido sem recuperar o guião integral.\n\n## Antes de produzir imagens\n\nA versão integral do guião usado na revisão anterior não está disponível neste documento. Esta ficha regista as correções de continuidade conhecidas, mas **não substitui o guião completo nem autoriza a reconstrução de diálogos por adivinhação**.\n\nQuando o texto integral estiver consolidado:\n1. aprovar a narrativa completa;\n2. dividir em cenas com ações e diálogos específicos;\n3. enviar as cenas aprovadas para o Pipeline;\n4. gerar e aprovar cada imagem individualmente;\n5. só depois disponibilizar o prompt de animação correspondente na aba Video.\n","kind":"ficha"},{"number":3,"title":"Monte do Coxa","status":"História-base aprovada","path":"Temporadas/Temporada-1/episodio-03-monte-do-coxa.md","content":"# Episódio 3 — Monte do Coxa\n\n**Estado:** Aprovado como história-base  \n**Formato:** Sitcom animada, humor de situação e escalada caricatural.\n\n## Premissa\n\nCoxa refugia-se no seu monte alentejano para escapar à televisão e ficar em paz. Está na sala, sentado à secretária, a ler papéis, quando o Capitão Gancho chega num Mercedes preto para o levar de volta. O caseiro é uma personagem secundária e trata o Capitão por «Doutor». Coxa recusa-se a regressar e ameaça ir para a SIC. O Capitão, que precisa de audiências, acaba por o meter amarrado na mala do carro.\n\n## Sequência narrativa\n\n### 1. O monte alentejano\n\nEstabelecer o ambiente rural e tranquilo. Coxa está na sala do monte, sentado à secretária a ler papéis, como se estivesse finalmente dedicado à sua vida longe dos estúdios.\n\n### 2. A chegada do Capitão\n\nUm Mercedes preto entra na propriedade. O caseiro recebe o visitante e trata-o por **«Doutor»**. O Capitão não veio fazer uma visita social: veio buscar Coxa.\n\n### 3. A recusa\n\nCoxa não quer abandonar o monte. Quer ficar ali e recusa-se a voltar à televisão. A tensão cresce à medida que o Capitão deixa claro que precisa de o levar de volta.\n\n### 4. O desfecho\n\nCoxa insiste que não vai com ele e ameaça ir para a SIC. O Capitão acaba por o meter, amarrado, na mala do Mercedes. A ação é caricatural e deve ser encenada como humor negro de desenho animado, sem realismo gráfico.\n\n## Diálogo-chave aprovado\n\n**COXA:** Eu não vou consigo! Fico aqui no meu monte!\n\n**CAPITÃO GANCHO:** Preciso que volte.\n\n**COXA:** Então arranje outro! Eu vou para a SIC!\n\n**CAPITÃO GANCHO:** Você vai para onde eu o levar. Eu preciso de ter audiências.\n\nQuando o Capitão se prepara para partir, o caseiro pergunta:\n\n**CASEIRO:** Doutor… quer que lhe prepare alguma coisa para a viagem?\n\n**CAPITÃO GANCHO:** Não. Trate do monte.\n\nA mala fecha-se e o Mercedes arranca. O caseiro fica sozinho à entrada da propriedade.\n\n**FIM.**\n\n## Regras de continuidade\n\n- O monte deve parecer uma propriedade rural alentejana.\n- A cena da sala inclui a secretária e os papéis que Coxa está a ler.\n- O Capitão chega num Mercedes preto.\n- O caseiro é secundário e trata o Capitão exclusivamente por «Doutor» nesta interação.\n- A ameaça de Coxa ir para a SIC e a frase do Capitão sobre precisar de audiências são elementos essenciais do episódio.\n- Não inventar biografia nem características vocais para Coxa.\n- A história está aprovada; storyboard, prompts de imagem e vídeo serão preparados numa fase posterior.\n","kind":"guião"},{"number":4,"title":"O Casting dos Desesperados","status":"Ideia provisória · por desenvolver","path":"Temporadas/Temporada-1/episodio-04-o-casting-dos-desesperados.md","content":"# Episódio 4 — O Casting dos Desesperados\n\n**Estado:** ideia provisória; falta fechar uma premissa forte e escrever o guião.\n\n## Direção atual\nA história deverá satirizar os castings de reality shows e o desespero da produção por encontrar concorrentes. A sala de casting só deve ser criada como cenário-base reutilizável se não existir já um asset adequado.\n\n## Próximo passo\nDefinir o conflito central, a escalada cómica e o desfecho antes de produzir o cenário ou storyboard.","kind":"ficha"},{"number":5,"title":"A Roda Está Viciada","status":"Rascunho de história · por fechar","path":"Temporadas/Temporada-1/episodio-05-a-roda-esta-viciada.md","content":"# Episódio 5 — A Roda Está Viciada\n\n**Estado:** rascunho de história; falta fechar o guião.\n\n## Premissa\nCapitão Gancho e Tininha enfrentam uma queda continuada de audiências. Tininha tenta justificar os números com explicações institucionais, enquanto o Capitão exige resultados. No final, corta-se para o escritório secreto de Teresa, que faz uma chamada e diz: “A transferência vai chegar.” A sugestão é que Teresa está a manipular as audiências, sem explicar o mecanismo.\n\n## Diálogo-base\n- CAPITÃO GANCHO: “As audiências voltaram a cair.”\n- TININHA: “É uma oscilação perfeitamente normal.”\n- CAPITÃO GANCHO: “Há três semanas que oscila sempre para baixo.”\n- CAPITÃO GANCHO: “Não quero uma apresentação. Quero audiências.”\n- TERESA: “Estou? Sim. A transferência vai chegar.”\n\n## Próximo passo\nTransformar o conceito num episódio curto com escalada e final visual.","kind":"ficha"},{"number":6,"title":"Edição Especialíssima","status":"Rascunho de história · por fechar","path":"Temporadas/Temporada-1/episodio-06-edicao-especialissima.md","content":"# Episódio 6 — Edição Especialíssima\n\n**Estado:** rascunho de história; falta fechar o guião.\n\n## Premissa\nA equipa está exausta porque Capitão Gancho marca edições de reality show consecutivas. A edição anterior acabou ontem e a próxima começa amanhã. O estagiário está de rastos e tenta perceber quando poderá descansar.\n\n## Diálogo-base\n- PRODUTORA: “Mas a última edição acabou ontem!”\n- CAPITÃO GANCHO: “E amanhã começa outra.”\n- PRODUTOR: “Amanhã?!”\n- ESTAGIÁRIO: “Amanhã já é depois de hoje?”\n- CAPITÃO GANCHO: “Gosto de ver que ainda está atento.”\n\n## Próximo passo\nFechar a escalada cómica sem transformar a equipa numa sucessão de piadas soltas.","kind":"ficha"},{"number":7,"title":"A Espia","status":"Conceito provisório · por desenvolver","path":"Temporadas/Temporada-1/episodio-07-a-espia.md","content":"# Episódio 7 — A Espia\n\n**Estado:** conceito provisório; ainda sem guião fechado.\n\n## Direção atual\nA história deverá aproveitar Teresa e o seu escritório secreto, com intriga e observação dos movimentos da estação. O mecanismo da espionagem, o alvo e o desfecho ainda precisam de ser definidos.\n\n## Próximo passo\nFechar a premissa e o conflito antes de criar planos ou assets específicos.","kind":"ficha"},{"number":8,"title":"O Barco da TVI","status":"Rascunho de história · por fechar","path":"Temporadas/Temporada-1/episodio-08-o-barco-da-tvi.md","content":"# Episódio 8 — O Barco da TVI\n\n**Estado:** rascunho de história; falta fechar o guião.\n\n## Premissa\nMário Galático apresenta uma edição de reality show a bordo de um barco no Tejo, perto da Ponte 25 de Abril. A situação começa a correr mal quando o barco começa a afundar. A sátira centra-se na repetição interminável de formatos e edições especiais.\n\n## Diálogo-base\n- CAPITÃO GANCHO: “Mas isso não é o mesmo Big Brother de há três semanas?!”\n- MÁRIO GALÁTICO: “Não! Este é o Desafio Final All Stars Inverno Especial.”\n- MÁRIO GALÁTICO: “Os mesmos concorrentes, os mesmos segredos, as mesmas discussões… mas a casa tem uma máquina de café nova!”\n\n## Continuidade\nO nome da empresa de Mário é sempre **Dourito Blue**. As imagens do barco a afundar e outras revelações específicas ficam para depois da aprovação do guião.","kind":"ficha"},{"number":9,"title":"O Lançamento Naval","status":"Primeira versão, por aprovar","path":"Temporadas/Temporada-1/episodio-09-o-lancamento-naval.md","content":"# OS LESADOS — Temporada 1, Episódio 9\n# O Lançamento Naval\n\n**Estado:** primeira versão do guião, por aprovar  \n**Duração-alvo:** 3–4 minutos  \n**Personagens:** Mário Galático, Capitão Gancho, Tininha, produtor de continuidade  \n**Marca ficcional:** Dourito Blue\n\n## CENA 1 — EXTERIOR TVI — MANHÃ\n\n**PLANO DE ABERTURA:** plano aéreo do edifício da TVI. A câmara aproxima-se lentamente da torre e da fachada. Continuar o movimento com o background existente de transição exterior TVI e cortar para o corredor de bastidores.\n\nAo longe, ouve-se uma buzina marítima.\n\n## CENA 2 — CORREDOR DE BASTIDORES\n\nFuncionários passam apressados. Um deles pára, com o café a meio caminho da boca. A buzina ouve-se outra vez, agora mais perto.\n\nAs portas abrem-se. MÁRIO GALÁTICO entra de braços abertos. Dois assistentes transportam uma enorme maquete de um navio, com luzes de apresentação e um pequeno palco na proa.\n\n**MÁRIO GALÁTICO:** Meus senhores! Preparem-se para o maior lançamento naval da história da televisão!\n\nUm assistente bate com a maquete na ombreira da porta.\n\n**MÁRIO GALÁTICO:** Cuidado! Aquilo vale mais do que este corredor!\n\n**PRODUTOR DE CONTINUIDADE:** O senhor tem autorização para estar aqui?\n\n**MÁRIO GALÁTICO:** Autorização? Eu trouxe a embarcação. A autorização vem a bordo!\n\nA maquete atravessa o enquadramento e tapa a câmara.\n\n## CENA 3 — GABINETE DO CAPITÃO GANCHO\n\nA maquete sai do enquadramento e revela o gabinete do Capitão. O Capitão está a analisar a grelha de programação. Mário entra sem bater.\n\n**MÁRIO GALÁTICO:** Capitão! Preciso do estúdio principal. Tenho uma apresentação histórica.\n\n**CAPITÃO GANCHO:** De quê?\n\n**MÁRIO GALÁTICO:** Dos meus novos navios.\n\nPausa.\n\n**CAPITÃO GANCHO:** Isso faz-se num porto.\n\n**MÁRIO GALÁTICO:** Exatamente! E a televisão é o porto de todas as grandes ideias.\n\nO Capitão pousa a caneta.\n\n**CAPITÃO GANCHO:** O estúdio está ocupado.\n\n**MÁRIO GALÁTICO:** Ótimo. Já temos público.\n\n**CAPITÃO GANCHO:** Está ocupado com um programa.\n\n**MÁRIO GALÁTICO:** Melhor. Fazemos uma parceria.\n\n**CAPITÃO GANCHO:** Não.\n\n**MÁRIO GALÁTICO:** Uma parceria editorial.\n\n**CAPITÃO GANCHO:** Não.\n\n**MÁRIO GALÁTICO:** Uma parceria editorial com naming rights.\n\nO Capitão fecha lentamente a pasta.\n\n**CAPITÃO GANCHO:** Quanto tempo?\n\n**MÁRIO GALÁTICO:** Dez minutos.\n\n**CAPITÃO GANCHO:** Tem cinco.\n\n**MÁRIO GALÁTICO:** Perfeito. Os primeiros cinco são a apresentação. Os outros cinco são a experiência imersiva.\n\nO produtor começa a sair discretamente.\n\n**CAPITÃO GANCHO:** Volte aqui.\n\nO produtor pára.\n\n**CAPITÃO GANCHO:** Ainda não lhe expliquei o orçamento.\n\n## CENA 4 — ESTÚDIO PRINCIPAL\n\nAs luzes do estúdio acendem-se uma a uma. Tininha observa a equipa a afastar elementos do cenário para abrir espaço à apresentação. O Capitão tenta manter a situação sob controlo.\n\nMário sobe ao palco. No ecrã há imagens promocionais dos navios da Dourito Blue; os grafismos finais devem ser aplicados com assets aprovados, não gerados como texto aleatório.\n\n**MÁRIO GALÁTICO:** Apresento-vos o futuro da navegação! O Dourito Blue Premium, o Dourito Blue All Stars e a nossa grande inovação: o Dourito Blue Desafio Final Especial de Inverno!\n\nO Capitão fecha os olhos por um instante.\n\n**TININHA:** Temos um navio com nome de grelha de programação?\n\n**CAPITÃO GANCHO:** Temos um homem com acesso ao estúdio.\n\nMário aponta para a primeira maquete.\n\n**MÁRIO GALÁTICO:** O Premium tem restaurantes temáticos, suites de luxo e um sistema de entretenimento revolucionário!\n\n**TININHA:** Finalmente, algo normal.\n\n**MÁRIO GALÁTICO:** Cada passageiro recebe uma nomeação semanal!\n\nTininha deixa de sorrir.\n\n**MÁRIO GALÁTICO:** E no último dia, o menos popular abandona o navio!\n\nPausa.\n\n**CAPITÃO GANCHO:** Isso chama-se enjoo marítimo.\n\n**MÁRIO GALÁTICO:** Não, Capitão. Isso chama-se envolvimento do passageiro.\n\nMário aponta para o segundo navio.\n\n**MÁRIO GALÁTICO:** O All Stars traz de volta os melhores passageiros das edições anteriores!\n\n**TININHA:** Os passageiros?\n\n**MÁRIO GALÁTICO:** Os mesmos quartos, as mesmas mesas, as mesmas discussões. Mas desta vez temos uma piscina nova!\n\n**CAPITÃO GANCHO:** Isso não é um navio. É uma repetição com água.\n\nMário fica emocionado.\n\n**MÁRIO GALÁTICO:** Vou usar essa frase na campanha.\n\n## CENA 5 — A REVELAÇÃO\n\nUm assistente aproxima-se do Capitão e sussurra-lhe.\n\n**ASSISTENTE:** Doutor... há um pequeno problema.\n\n**CAPITÃO GANCHO:** Qual?\n\n**ASSISTENTE:** O senhor Mário não trouxe só as maquetes.\n\nO Capitão olha para o monitor do estúdio. Surge uma imagem em direto da entrada de serviço da TVI. Um navio gigantesco da Dourito Blue está estacionado do lado de fora, demasiado grande para o espaço.\n\nSilêncio.\n\n**CAPITÃO GANCHO:** Isso é uma imagem.\n\n**ASSISTENTE:** Sim, Doutor.\n\n**CAPITÃO GANCHO:** Ainda bem.\n\n**ASSISTENTE:** É em direto.\n\nO Capitão aproxima-se do monitor. Pela janela do estúdio, uma sombra gigantesca cobre a luz. Os adereços tremem ligeiramente com o som de uma buzina.\n\n**TININHA:** Isto estava previsto na produção?\n\n**CAPITÃO GANCHO:** Não.\n\n**TININHA:** Então quem autorizou?\n\nO Capitão olha para Mário.\n\n**MÁRIO GALÁTICO:** Ninguém. Quis surpreender-vos!\n\nA buzina soa novamente. A luz vermelha de uma câmara acende-se.\n\n**MÁRIO GALÁTICO:** Já estamos em direto!\n\n## CENA 6 — FECHO\n\nO Capitão respira fundo, endireita a gravata e aproxima-se da câmara.\n\n**CAPITÃO GANCHO:** Boa tarde. Por motivos técnicos, a apresentação de hoje será ligeiramente diferente do previsto.\n\nAo fundo, Mário sobe à maquete e acena como se estivesse na proa de um navio verdadeiro.\n\n**MÁRIO GALÁTICO:** BEM-VINDOS A BORDO!\n\nO Capitão olha para a câmara. Uma buzina marítima faz tremer o estúdio.\n\n**CAPITÃO GANCHO:** Amanhã, vamos fazer um programa sobre seguros.\n\n**CORTE PARA PRETO.**\n\nOuve-se uma última buzina.\n\n**FIM.**\n\n## Notas de realização\n\n- Usar a abertura aérea da TVI já existente e a transição exterior; não gerar versões novas desses assets.\n- Fazer transições motivadas pela ação: maquete a tapar a lente, luzes do estúdio a acender e corte do monitor para o navio no exterior.\n- O navio gigante fica do lado de fora, na entrada de serviço. Não o mostrar a navegar literalmente por corredores interiores.\n- Mário é expansivo e genuinamente convencido de que cada ideia é genial. Capitão mantém frases curtas, voz baixa e autoridade prática; nunca grita.\n- Tininha mantém a compostura pública e a superioridade institucional.\n- A marca escreve-se sempre **Dourito Blue**.\n- O guião ainda não está aprovado. Não gerar storyboard final, imagens ou vídeo antes da aprovação do guião e da seleção dos masters.\n","kind":"guião"}];

    let state = {
      version: VERSION,

    function $(id) { return document.getElementById(id); }
    function esc(v) { return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
    function sanitize(t) {
      let s = String(t || "");
      s = s.replace(/\bGoucha\b/gi, "Coxa");
      s = s.replace(/\bMoniz\b/gi, "Capitão Gancho");
      s = s.replace(/\bCristina Ferreira\b/gi, "Tininha");
      s = s.replace(/\bTeresa Guilherme\b/gi, "Teresa Guilhermina I de Portugal");
      s = s.replace(/\s*—\s*/g, ", ");
      s = s.replace(/--/g, ", ");
      s = s.replace(/\s{2,}/g, " ");
      return s.trim();
    }
    function fmt(sec) { const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2,"0")}`; }
    function status(msg, type="info") { $("status").innerHTML = `<div class="status ${type}">${esc(msg)}</div>`; setTimeout(() => { if ($("status")) $("status").innerHTML = ""; }, 7000); }
    function apiStatus(msg, type="testing") { $("apiStatus").innerHTML = `<div class="api-status ${type}">${msg}</div>`; }
    function save() { try { localStorage.setItem("osLesados_html", JSON.stringify(state)); } catch(e) { status("Não foi possível guardar. Armazenamento cheio?", "error"); } }
    function load() {
      try {
        const raw = localStorage.getItem("osLesados_html");
        if (raw) state = Object.assign(state, JSON.parse(raw));
      } catch(e) {}
      normalize();
    }
    function normalize() {
      if (!Array.isArray(state.seasons)) state.seasons = [];
      if (state.version !== VERSION) {
        // Migração v1 -> v2: episódios antigos ganham story:null e continuam
        // a renderizar pelo motor clássico, sem corrupção.
        state.seasons.forEach(s => (s.episodes || []).forEach(ep => {
          if (!("story" in ep)) ep.story = null;
          if (!("decoupageApproved" in ep)) { ep.decoupageApproved = false; (ep.scenes || []).forEach(sc => { sc.approved = false; }); }
        }));
        state.version = VERSION;
        try { localStorage.setItem("osLesados_html", JSON.stringify(state)); } catch (e) {}
      }
      state.seasons.forEach(s => {
        if (!Array.isArray(s.episodes)) s.episodes = [];
        s.episodes.forEach(ep => {
          if (!Array.isArray(ep.scenes)) ep.scenes = [];
          ep.number = Number(ep.number || 1);
          ep.name = sanitize(ep.name || "O Grande Plano");
          ep.premise = sanitize(ep.premise || "");
          ep.decoupageApproved = Boolean(ep.decoupageApproved);
          if (!ep.narration) ep.narration = buildNarration(ep.name);
          if (!ep.narration.approvedVoiceOver) {
            ep.narration.open = null;
            ep.narration.close = null;
          }
          if (!ep.hook && ep.number) ep.hook = pickSeasonHook(ep.number);
          ep.scenes.forEach(sc => {
            sc.location = sanitize(sc.location || "Estúdio Central");
            sc.action = sanitize(sc.action || "");
            sc.characters = Array.isArray(sc.characters) ? sc.characters.filter(id => charById[id]) : [];
            resolveOfficeSide(sc);
            sc.alertMel = sc.characters.includes("abelha");
            sc.prompt = sc.prompt || buildPrompt(sc);
            sc.imageUrl = sc.imageUrl || null;
            sc.model = sc.model || null;
            sc.variant = Number(sc.variant || 0);
            sc.approved = Boolean(sc.approved);
            sc.referenceCount = Number(sc.referenceCount || 0);
          });
          ep.audit = audit(ep);
        });
      });
    }
    function switchTab(tab) {
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
      document.querySelectorAll(".pane").forEach(p => p.classList.toggle("active", p.id === tab));
      if (tab === "script") renderScript();
      if (tab === "decoupage") renderDecoupage();
      if (tab === "pipeline") renderPipeline();
      if (tab === "canon") renderCanon();
      if (tab === "video") renderVideo();
      if (tab === "sala") { enterSala(); }
      if (tab === "archive") renderArchive();
    }
    function suggestion() {
      const idea = suggestions[Math.floor(Math.random() * suggestions.length)];
      $("suggestionTitle").textContent = "“" + idea.title + "”";
      $("suggestionText").textContent = idea.premise;
      $("episodeName").value = idea.title;
      $("premise").value = idea.premise;
      status("Sugestão gerada: nome + premissa.", "success");

    // Fluxo único de criação: nome+premissa -> história IA -> episódio novo.

    async function aiGenerateEpisode() {
      if (location.protocol === "file:") return status("Para gerar, abre via http://localhost:8787.", "error");
      const name = ($("episodeName").value || "").trim();
      const premise = ($("premise").value || "").trim();
      if (!name) return status("Escreve o nome do episódio.", "error");
      if (!premise) return status("Escreve uma premissa.", "error");
      const btn = $("aiGenerateBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> IA a escrever...';
      try {
        const cleanPremise = sanitize(premise), cleanName = sanitize(name);
        const stars = detectCast(cleanPremise);
        const castIds = (stars.length ? stars : ["coxa", "claudio"]).filter(id => charById[id]);
        const res = await fetch(`${backendUrl()}/story/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ premise: cleanPremise, castIds })
        });
        let data;
        try { data = await res.json(); }
        catch { throw new Error(`Resposta inválida do backend (HTTP ${res.status}).`); }
        if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
        if (!data.story) throw new Error("Backend não devolveu história.");
        if (!state.seasons.length) state.seasons.push({ id: "s1", name: "Season 1", episodes: [] });
        const season = state.seasons.find(s => s.id === state.currentSeason) || state.seasons[0];
        const number = (season.episodes.length || 0) + 1;
        const story = normalizeAIStory(data.story, cleanPremise, castIds);
        story.title = cleanName;
        const episode = {
          id: `e${season.id}-${number}-${Date.now()}`,
          number, name: cleanName, premise: cleanPremise,
          season: state.seasons.indexOf(season) + 1,
          story, scenes: storyToScenes(story),
          narration: buildNarration(cleanName),
          tagScene: buildTagScene(castIds, cleanPremise),
          coldOpen: pickColdOpen(premise, number)
        };
        episode.audit = [...auditStory(episode), ...audit(episode)];
        season.episodes.push(episode);
        state.currentSeason = season.id;
        state.currentEpisode = episode.id;
        state.currentScene = episode.scenes[0]?.id || null;
        save();
        renderAudit(episode.audit);
        renderScript();
        renderPipeline();
        renderHeaderNav();
        switchTab("script");
        $("episodeName").value = "";
        $("premise").value = "";
        status(`Episódio ${number} gerado por IA (${data.provider || "gemini-text"}, ${data.model || "?"}).`, "success");
      } catch (e) {
        status("IA indisponível: " + e.message + " Nenhum episódio foi criado.", "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "✨ Gerar episódio com IA";
      }
    }

        const dialogueLines = [...source.content.matchAll(/^\s*-\s*([^:\n]{2,45}):\s*[“"]?([^\n”"]+)[”"]?\s*$/gm)].map(m => ({speaker:m[1].trim(),line:m[2].trim()}));

          {title:"Remate",body:"A situação chega a uma consequência cómica que fecha a ideia do episódio. " + dialogueLines.slice(2).map(d=>d.speaker+": "+d.line).join(" ")}

    function endFrameHint(scene) {
      const cam = scene.camera || "";
      if (/WHIP PAN/.test(cam)) return "frame final: câmara já assente no novo sujeito após o pan.";
      if (/TRACKING/.test(cam)) return "frame final: personagens progrediram pelo corredor, mesma localização.";
      if (/DOLLY IN|ZOOM IN/.test(cam)) return "frame final: enquadramento mais fechado no sujeito, mesmo setup.";
      if (/DOLLY OUT|ZOOM OUT/.test(cam)) return "frame final: enquadramento mais aberto, revela mais do cenário.";
      if (scene.type === "INSERT") return "frame final: detalhe assente após a ação (ex. mão pousada, ecrã visível).";
      if (scene.type === "REACTION") return "frame final: segura a reação no pico da expressão.";

    }
    function updateTicker() {
      const el = $("tickerText");
      if (!el) return;
      const ep = currentEpisode();
      let txt;
      if (ep) {
        const ap = ep.scenes.filter(s => s.approved).length;
        txt = `EM DIRETO ▸ ${ep.name} ▸ Episódio ${ep.number} ▸ ${ep.scenes.length} takes ▸ ${ap} aprovados ▸ ALERTA MEL ▸ A seguir: mais caos nos bastidores ▸ `;
      } else {
        txt = "BOMBAAAA ▸ Exclusivo em direto ▸ Gera um episódio na sidebar para entrar no ar ▸ ALERTA MEL ▸ ";
      }
      el.textContent = txt + txt;
    }
    function backendUrl() { return ($("backendUrl").value || "/api").replace(/\/$/, ""); }
    function model() { return $("modelSelect").value || "gemini-nano-banana-2.1"; }
    function provider() { const el = $("providerSelect"); return (el && el.value) || "gemini"; }
    const providerModels = {
      gemini: [["gemini-nano-banana-2.1", "Nano Banana 2.1"], ["gemini-3-pro-image", "Nano Banana Pro"]],
      openai: [["gpt-image-1", "gpt-image-1 (recomendado)"], ["gpt-image-1-mini", "gpt-image-1-mini (rápido)"], ["gpt-image-1.5", "gpt-image-1.5"]],
      huggingface: [["stabilityai/stable-diffusion-xl-base-1.0", "SDXL base (default)"], ["stabilityai/stable-diffusion-2-1", "SD 2.1"]],
      cloudflare: [["@cf/black-forest-labs/flux-1-schnell", "FLUX schnell (rápido)"], ["@cf/stabilityai/stable-diffusion-xl-base-1.0", "SDXL base"]]
    };
    function syncModelOptions() {
      const sel = $("modelSelect");
      const list = providerModels[provider()] || providerModels.gemini;
      sel.innerHTML = list.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("");
    }
    async function safeJson(res) { try { return await res.json(); } catch { return { ok:false, error: await res.text() || `HTTP ${res.status}` }; } }
    function collectRefs(ep, scene) {
      const refs = [];
      if (scene.reframeOf) {
        const base = ep.scenes.find(s => s.id === scene.reframeOf);
        if (base?.imageUrl) {
          const m = base.imageUrl.match(/^data:([^;]+);base64,(.+)$/);
          if (m) refs.push({ label:`continuity:${base.id}`, mimeType:m[1], base64:m[2] });
        }
      }
      return refs;
    }
    async function testBackend() {
      if (location.protocol === "file:") return apiStatus("❌ Abre via http://localhost:8787, não file://.", "error");
      const btn = $("testBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> A testar...';
      apiStatus("A verificar backend...", "testing");
      try {
        const h = await fetch(`${backendUrl()}/health`, { headers: { Accept: "application/json" } });
        const health = await safeJson(h);
        if (!h.ok || health.ok === false) throw new Error(health.error || `HTTP ${h.status}`);
        if (!health.keyConfigured) return apiStatus("⚠️ Backend ativo, mas nenhuma chave configurada no .env.", "testing");
        apiStatus(`Backend ativo (${esc(provider())}). A fazer geração real de teste...`, "testing");
        const t = await fetch(`${backendUrl()}/test`, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ provider: provider(), model: model() }) });
        const test = await safeJson(t);
        if (!t.ok || test.ok === false) throw new Error(test.error || `HTTP ${t.status}`);
        apiStatus(`✅ OK. Fornecedor: ${esc(test.provider || provider())} · Modelo: ${esc(test.model)} · Bytes: ${Number(test.bytes).toLocaleString("pt-PT")}`, "success");
      } catch(e) {
        apiStatus("❌ " + esc(e.message), "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Testar backend";
      }
    }
    async function checkContext() {
      if (location.protocol === "file:") return $("contextStatus").innerHTML = '<div class="api-status error">Abre via backend.</div>';
      $("contextStatus").innerHTML = '<div class="api-status testing">A ler contexto...</div>';
      try {
        const res = await fetch(`${backendUrl()}/context/status`, { headers: { Accept: "application/json" } });
        const data = await safeJson(res);
        if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
        const chars = Object.entries(data.characters || {}).map(([k,v]) => `${k}: ${v ? "✅" : "❌"}`).join("<br>");
        const bgs = Object.entries(data.backgrounds || {}).map(([k,v]) => `${esc(k)}: ${v ? "✅" : "❌"}`).join("<br>");
        $("contextStatus").innerHTML = `<div class="api-status success"><strong>Personagens</strong><br>${chars}<br><br><strong>Backgrounds</strong><br>${bgs}</div>`;
      } catch(e) {
        $("contextStatus").innerHTML = `<div class="api-status error">❌ ${esc(e.message)}</div>`;
      }
    }
    async function generateImage() {
      if (location.protocol === "file:") return status("Para imagens, abre via http://localhost:8787.", "error");
      const ep = currentEpisode();
      if (!ep) return status("Gera um episódio primeiro.", "error");
      const scene = ep.scenes.find(s => s.id === state.currentScene);
      if (!scene) return status("Seleciona um take.", "error");
      const prompt = ($("promptInput")?.value || scene.prompt || "").trim();
      if (!prompt) return status("Prompt vazio.", "error");
      if (scene.approved && !confirm("Esta imagem está aprovada. Substituir?")) return;
      const btn = $("generateImageBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> A gerar...';
      try {
        const refs = collectRefs(ep, scene);
        const res = await fetch(`${backendUrl()}/generate-image`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt,
            provider: provider(),
            model: model(),
            references: refs,
            sceneContext: { characters: scene.characters || [], location: scene.location || "" }
          })
        });
        const data = await safeJson(res);
        if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
        if (!data.base64) throw new Error("Backend não devolveu imagem.");
        scene.imageUrl = `data:${data.mimeType || "image/png"};base64,${data.base64}`;
        scene.prompt = prompt;
        scene.model = data.model || model();
        scene.variant = Number(scene.variant || 0) + 1;
        scene.approved = false;
        scene.referenceCount = Number(data.referenceCount || refs.length || 0);
        save();
        renderPipeline();
        updateVideoTab();
        updateTicker();
        status(`Imagem gerada com ${scene.model}.`, "success");
        if (Array.isArray(data.warnings) && data.warnings.length) status(data.warnings.join(" | "), "info");
      } catch(e) {
        status("Erro: " + e.message, "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Gerar imagem";
      }
    }
    function resetAll() {
      if (!confirm("Apagar tudo?")) return;
      localStorage.removeItem("osLesados_html");
      state = { version: VERSION, seasons: [], currentSeason: null, currentEpisode: null, currentScene: null };
      $("scriptContent").innerHTML = '<div class="empty"><h3>Guião</h3><p>Gera um episódio.</p></div>';
      $("pipelineContent").innerHTML = '<div class="empty"><h3>Pipeline</h3><p>Gera um episódio.</p></div>';
      $("videoContent").innerHTML = "";
      updateVideoTab();
      renderHeaderNav();
      $("audit").innerHTML = "";
      $("apiStatus").innerHTML = "";
      $("contextStatus").innerHTML = "";
      status("Tudo apagado.", "success");
    }

    document.addEventListener("DOMContentLoaded", () => {
      load();
      loadRepoEpisodes();
      renderCanon();
      suggestion();
      updateVideoTab();
      renderHeaderNav();
      $("suggestBtn").addEventListener("click", suggestion);
      $("aiGenerateBtn").addEventListener("click", aiGenerateEpisode);
      $("testBtn").addEventListener("click", testBackend);
      $("contextBtn").addEventListener("click", checkContext);
      $("providerSelect").addEventListener("change", syncModelOptions);
      syncModelOptions();
      $("aiStoryBtn").addEventListener("click", expandWithAI);
      $("resetBtn").addEventListener("click", resetAll);
      loadBible();
      document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));
      if (state.seasons.length && state.currentEpisode) {
        const ep = currentEpisode();
        if (ep) {
          renderAudit(ep.audit);
          renderScript();
          renderPipeline();
        }
      }
    });
  </script>
</body>
</html>
