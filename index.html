<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OS LESADOS — HTML Único</title>
  <style>
    :root {
      --primary: #ff006e;
      --secondary: #8338ec;
      --dark: #0f0f1a;
      --darker: #05050a;
      --success: #00c853;
      --warning: #ffab00;
      --danger: #ff1744;
      --canon: #ffd700;
      --border: #2a2a4a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--dark);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1700px;
      margin: 0 auto;
      background: var(--darker);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .header {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(1000px 200px at 20% -40px, rgba(255,0,110,.45), transparent 60%),
        radial-gradient(900px 220px at 85% -30px, rgba(131,56,236,.55), transparent 60%),
        linear-gradient(90deg, #2b0a2e, #12071f 55%, #0a0a18);
      padding: 26px 20px 0;
      border-bottom: 3px solid var(--canon);
      box-shadow: 0 0 24px rgba(255,215,0,.25), inset 0 -18px 40px rgba(0,0,0,.5);
      text-align: center;
    }
    .header::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px);
    }
    .header h1 { color: #fff; font-size: 2.4em; letter-spacing: 8px; text-transform: uppercase; text-shadow: 0 0 18px rgba(255,0,110,.8), 0 2px 0 #000; position: relative; }
    .header h1::after { content: ""; display: block; width: 220px; height: 3px; margin: 10px auto 0; background: linear-gradient(90deg, transparent, var(--canon), transparent); box-shadow: 0 0 12px var(--canon); }
    .header p { color: rgba(255,255,255,.9); margin-top: 8px; font-size: .95em; position: relative; }
    .live-badge { position: absolute; top: 14px; right: 16px; display: flex; align-items: center; gap: 7px; background: #000; border: 1px solid var(--danger); color: #fff; font-weight: 800; font-size: .72em; letter-spacing: 2px; padding: 6px 12px; border-radius: 20px; box-shadow: 0 0 14px rgba(255,23,68,.7); z-index: 2; }
    .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--danger); } 50% { opacity: .25; box-shadow: none; } }
    .epnav { position: relative; display: flex; gap: 14px; align-items: stretch; justify-content: center; flex-wrap: wrap; margin: 12px auto 14px; padding: 10px 18px; width: fit-content; max-width: 96%; background: rgba(0,0,0,.5); border: 1px solid rgba(255,215,0,.4); border-radius: 14px; box-shadow: 0 0 18px rgba(255,215,0,.15), inset 0 1px 0 rgba(255,255,255,.06); backdrop-filter: blur(4px); }
    .epnav-group { display: flex; align-items: center; gap: 9px; }
    .epnav-kicker { font-size: .62em; letter-spacing: 2.5px; color: var(--canon); font-weight: 800; text-transform: uppercase; text-shadow: 0 0 8px rgba(255,215,0,.5); }
    .epnav-select-wrap { position: relative; display: inline-block; }
    .epnav-select-wrap::after { content: "▾"; position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--canon); pointer-events: none; font-size: .8em; }
    .epnav select { appearance: none; -webkit-appearance: none; background: linear-gradient(180deg, #1c1c34, #0f0f1a); border: 1px solid rgba(255,255,255,.18); color: #fff; border-radius: 9px; padding: 8px 30px 8px 12px; font-family: inherit; font-size: .85em; font-weight: 700; max-width: 300px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .epnav select:hover { border-color: var(--primary); }
    .epnav select:focus { outline: none; border-color: var(--canon); box-shadow: 0 0 12px rgba(255,215,0,.45); }
    .epnav select option { background: #0f0f1a; font-weight: 400; }
    .epnav-divider { width: 1px; background: linear-gradient(transparent, rgba(255,215,0,.45), transparent); }
    .epnav-meta { align-self: center; font-size: .72em; font-weight: 800; letter-spacing: 1px; color: #000; background: linear-gradient(90deg, var(--canon), #ffe97a); padding: 6px 14px; border-radius: 20px; box-shadow: 0 0 12px rgba(255,215,0,.5); white-space: nowrap; }
    .epnav-empty { font-size: .8em; color: rgba(255,255,255,.7); font-style: italic; }
    .layout { display: grid; grid-template-columns: 360px 1fr; min-height: 85vh; }
    .sidebar { background: #151525; border-right: 1px solid var(--border); padding: 18px; overflow-y: auto; max-height: 85vh; }
    .content { padding: 22px; overflow-y: auto; max-height: 85vh; }
    .title { color: var(--warning); font-size: .95em; text-transform: uppercase; font-weight: 800; margin: 18px 0 10px; border-bottom: 1px solid var(--secondary); padding-bottom: 6px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 6px; color: #a0a0c0; font-size: .82em; font-weight: 700; }
    .field input, .field textarea, .field select {
      width: 100%; background: #0f0f1a; border: 1px solid var(--border); color: #fff; border-radius: 6px; padding: 10px; font-family: inherit; font-size: .9em;
    }
    .field textarea { min-height: 90px; resize: vertical; }
    .btn {
      width: 100%; border: none; border-radius: 6px; padding: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; color: #fff;
      background: linear-gradient(90deg, var(--primary), var(--secondary)); margin-bottom: 8px;
    }
    .btn:hover { opacity: .92; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-sm { padding: 9px 10px; font-size: .82em; }
    .reference-guide { margin: 12px 0 14px; padding: 12px; border: 1px solid rgba(255,255,255,.14); border-radius: 9px; background: rgba(255,255,255,.035); }
    .reference-guide-title { font-size: .78em; color: var(--canon); font-weight: 900; letter-spacing: .7px; text-transform: uppercase; margin-bottom: 8px; }
    .reference-guide-note { color: #b9b9ce; font-size: .78em; line-height: 1.5; margin-bottom: 10px; }
    .reference-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .reference-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); color: #fff; font-size: .76em; font-weight: 850; box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
    .reference-chip::before { content: "REF"; font-size: .68em; letter-spacing: .6px; background: rgba(0,0,0,.25); padding: 3px 5px; border-radius: 5px; }
    .reference-empty { font-size: .8em; color: #a0a0c0; padding: 8px 0; }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-success { background: var(--success); color: #000; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: #2d2b55; border: 1px solid var(--secondary); color: #d7c7ff; }
    .box { background: #1a1a30; border: 1px solid var(--secondary); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
    .hint { color: #888; font-size: .78em; line-height: 1.35; margin-top: 6px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-bottom: 18px; }
    .tab { padding: 10px 16px; border: 1px solid var(--border); background: #151525; color: #a0a0c0; border-radius: 6px 6px 0 0; cursor: pointer; font-weight: 700; font-size: .88em; }
    .tab.active { background: var(--secondary); color: #fff; border-color: var(--secondary); }
    .pane { display: none; }
    .pane.active { display: block; }
    .empty { text-align: center; padding: 60px 20px; color: #666; }
    .empty h3 { color: var(--warning); margin-bottom: 8px; }
    .status, .api-status, .audit { padding: 10px; border-radius: 6px; margin-top: 10px; font-size: .85em; line-height: 1.4; }
    .status.info, .api-status.testing, .audit.warning { background: #1a1a30; border: 1px solid var(--warning); color: #ffe08a; }
    .status.success, .api-status.success, .audit.success { background: #051a0a; border: 1px solid var(--success); color: #7dffb0; }
    .status.error, .api-status.error, .audit.error, .audit.critical { background: #1a0505; border: 1px solid var(--danger); color: #ff9aa8; }
    .script {
      background: #fdfdf5; color: #111; font-family: "Courier New", monospace; font-size: 12.5px; line-height: 1.55;
      padding: 45px 55px; border-radius: 8px; max-width: 900px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,.3);
    }
    .script-head { text-align: center; border-bottom: 2px solid #999; padding-bottom: 16px; margin-bottom: 28px; }
    .script-head h2 { text-transform: uppercase; text-decoration: underline; margin-bottom: 6px; }
    .act { text-align: center; font-weight: 800; text-transform: uppercase; margin: 28px 0 16px; padding: 8px 0; border-top: 2px solid #999; border-bottom: 2px solid #999; letter-spacing: 2px; }
    .slug { font-weight: 800; text-transform: uppercase; margin: 22px 0 10px; }
    .camera { font-style: italic; color: #333; background: #ececdc; padding: 7px 10px; border-radius: 4px; margin: 8px 0; font-size: .92em; }
    .take { display: inline-block; background: #000; color: #00ff88; padding: 4px 9px; border-radius: 3px; font-size: .85em; font-weight: 800; margin: 10px 0 6px; }
    .action { margin: 8px 0 12px; }
    .char { text-align: center; text-transform: uppercase; font-weight: 800; margin: 14px 0 2px; }
    .paren { text-align: center; font-style: italic; margin-bottom: 2px; }
    .dialogue { text-align: center; margin: 0 0 12px; padding: 0 110px; }
    .reversal { text-align: center; font-style: italic; color: #8a0000; background: #fff3f3; border: 1px solid #ffcfcf; padding: 6px; border-radius: 4px; margin: 10px 0; font-size: .9em; }
    .reframe { font-style: italic; color: #666; background: #f1f1e5; border-left: 3px solid #999; padding: 6px 10px; margin: 8px 0; font-size: .88em; }
    .cut { text-align: right; font-weight: 800; text-transform: uppercase; margin: 16px 0; }
    .narr { background: #fff8e1; border: 2px dashed #b36a00; border-radius: 6px; padding: 12px 16px; margin: 18px 0; font-size: .92em; }
    .narr strong { color: #8a5200; }
    .timecard { background: #000; color: #fff; text-align: center; font-family: Georgia, serif; letter-spacing: 4px; text-transform: uppercase; padding: 22px 10px; margin: 24px 0; border-radius: 4px; font-size: 1.05em; }
    .transit { background: linear-gradient(90deg, #2b0a2e, #1a1a30); border-left: 4px solid var(--primary); border-radius: 4px; padding: 9px 14px; margin: 14px 0; font-size: .85em; color: #ffd7ea; }
    .transit strong { color: var(--primary); }
    .end { text-align: center; font-weight: 800; margin-top: 34px; letter-spacing: 2px; }
    .summary { background: #1a1a30; border: 2px solid var(--canon); border-radius: 8px; padding: 18px; margin-bottom: 18px; }
    .summary h3 { color: var(--canon); margin-bottom: 12px; }
    .grid-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .card-mini { background: #0f0f1a; border-radius: 6px; padding: 12px; }
    .label { color: var(--warning); font-size: .76em; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
    .value { color: #e0e0e0; font-size: .92em; line-height: 1.35; }
    .synopsis { background: #0f0f1a; border-left: 3px solid var(--canon); border-radius: 6px; padding: 14px; }
    .pipeline { display: grid; grid-template-columns: 240px 1fr; gap: 18px; }
    .nav { background: #151525; border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .season { background: #1a1a30; border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
    .season-title { color: var(--canon); font-weight: 800; margin-bottom: 8px; }
    .ep-list { display: flex; flex-direction: column; gap: 6px; }
    .ep-item { background: #0f0f1a; padding: 8px 10px; border-radius: 4px; font-size: .85em; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .ep-item.active { background: var(--secondary); color: #fff; }
    .ep-del { color: #888; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
    .ep-del:hover { color: #fff; background: var(--danger); }
    .gen { background: #151525; border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 18px; }
    .gen h3 { color: var(--warning); margin-bottom: 10px; }
    .prompt { width: 100%; min-height: 120px; background: #0f0f1a; border: 1px solid var(--border); color: #fff; border-radius: 6px; padding: 12px; font-family: "Courier New", monospace; font-size: .84em; resize: vertical; margin-bottom: 12px; }
    .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .buttons .btn { flex: 1; min-width: 150px; margin-bottom: 0; }
    .preview { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 2px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .preview img { width: 100%; height: 100%; object-fit: contain; }
    .preview .ph { color: #555; font-size: .9em; }
    .scenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .scene { background: #151525; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; }
    .scene:hover { border-color: var(--primary); transform: translateY(-2px); }
    .scene.selected { border-color: var(--canon); box-shadow: 0 0 14px rgba(255,215,0,.25); }
    .scene.done { background: rgba(46,204,113,.16); border-color: var(--success); }
    .scene.done:hover { border-color: var(--success); }
    .scene-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .scene-mark { flex: 0 0 auto; border: 1px solid var(--success); background: transparent; color: var(--success); border-radius: 5px; padding: 3px 7px; font-size: .66em; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; cursor: pointer; }
    .scene-mark:hover { background: rgba(46,204,113,.2); }
    .scene-mark.on { background: var(--success); color: #000; }
    .scene-img { width: 100%; aspect-ratio: 16 / 9; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .scene-img img { width: 100%; height: 100%; object-fit: cover; }
    .scene-img .none { color: #555; font-size: .8em; }
    .scene-info { padding: 10px; }
    .scene-title { color: var(--canon); font-weight: 800; font-size: .88em; margin-bottom: 4px; }
    .scene-desc { color: #a0a0c0; font-size: .73em; line-height: 1.3; }
    .badge { background: var(--danger); color: #fff; padding: 2px 6px; border-radius: 3px; font-size: .68em; font-weight: 800; margin-left: 5px; }
    .badge-ok { background: var(--success); color: #000; padding: 2px 6px; border-radius: 3px; font-size: .68em; font-weight: 800; margin-left: 5px; }
    .meta { color: #888; font-size: .68em; margin-top: 6px; line-height: 1.25; }
    .vtable { width: 100%; border-collapse: collapse; font-size: .82em; }
    .agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .agent { background: #151525; border: 1px solid var(--border); border-radius: 8px; padding: 12px; position: relative; }
    .agent.active { border-color: var(--warning); box-shadow: 0 0 12px rgba(255,171,0,.3); }
    .agent.done { border-color: var(--success); }
    .agent.failed { border-color: var(--danger); }
    .agent h4 { font-size: .9em; margin-bottom: 2px; }
    .agent .role { color: #a0a0c0; font-size: .72em; margin-bottom: 8px; }
    .st { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: .68em; font-weight: 800; text-transform: uppercase; background: #2d2b55; color: #d7c7ff; }
    .st.run { background: #4a3200; color: #ffd54d; animation: blink 1.2s ease-in-out infinite; }
    .st.ok { background: #051a0a; color: #7dffb0; border: 1px solid var(--success); }
    .st.err { background: #1a0505; color: #ff9aa8; border: 1px solid var(--danger); }
    .feed { background: #0f0f1a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; max-height: 260px; overflow-y: auto; font-size: .8em; line-height: 1.5; margin-bottom: 14px; }
    .feed .msg { margin-bottom: 7px; padding-bottom: 7px; border-bottom: 1px dotted #2a2a4a; }
    .flow { display: inline-block; background: #2d2b55; color: #fff; border-radius: 4px; padding: 1px 7px; font-weight: 800; font-size: .75em; }
    .flow small { color: #a0a0c0; font-weight: 400; }
    .src { font-size: .78em; color: #a0a0c0; margin-bottom: 5px; }
    .src a { color: #7dffb0; }
    .props { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .prop { background: #151525; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .prop.short { border-color: var(--canon); box-shadow: 0 0 10px rgba(255,215,0,.2); }
    .prop.dead { opacity: .55; }
    .prop h4 { color: var(--canon); font-size: .92em; margin-bottom: 6px; }
    .prop p { font-size: .8em; line-height: 1.45; color: #c0c0e0; margin: 4px 0; }
    .prop .kw { color: var(--warning); font-weight: 800; font-size: .72em; text-transform: uppercase; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
    .vtable th, .vtable td { border: 1px solid var(--border); padding: 10px; vertical-align: top; text-align: left; }
    .vtable th { background: #151525; color: var(--canon); text-transform: uppercase; font-size: .75em; }
    .vtable td.thumb img { width: 160px; border-radius: 4px; }
    .archive-script-view { margin-top: 14px; }
    .archive-script { white-space: pre-wrap; overflow-wrap: anywhere; display: block; background: #fdfdf5; color: #111; padding: 24px; border-radius: 8px; line-height: 1.55; font: 13px/1.55 "Courier New", monospace; max-height: 72vh; overflow: auto; }
    .vprompt { white-space: pre-wrap; font-family: "Courier New", monospace; font-size: .78em; line-height: 1.45; background: #0f0f1a; border-radius: 6px; padding: 10px; max-height: 280px; overflow-y: auto; margin: 0; }
    .vnote { font-size: .78em; line-height: 1.4; background: #1a1a30; border: 1px dashed var(--warning); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; color: #ffe08a; }
    .bible { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .char-card { background: #151525; border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .char-card h3 { color: var(--canon); margin-bottom: 8px; font-size: 1em; }
    .char-card p { font-size: .86em; line-height: 1.45; margin: 6px 0; color: #c0c0e0; }
    .char-card strong { color: var(--warning); }
    .char-body { display: flex; gap: 14px; align-items: flex-start; }
    .char-photo { flex: 0 0 120px; background: #fff; border-radius: 8px; padding: 6px; display: flex; align-items: center; justify-content: center; min-height: 120px; }
    .char-photo img { width: 100%; border-radius: 4px; display: block; }
    .char-photo .no-photo { color: #888; font-size: 2em; font-weight: 800; }
    .char-text { flex: 1; min-width: 0; }
    .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 6px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 1024px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
      .pipeline { grid-template-columns: 1fr; }
      .script { padding: 28px 18px; }
      .dialogue { padding: 0 28px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="live-badge"><span class="live-dot"></span> NO AR</div>
      <h1>OS LESADOS</h1>
      <div class="epnav" id="epNav"></div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="box">
          <div class="title" style="margin-top:0;border:0;padding:0;">Sugestão</div>
          <div id="suggestionTitle" style="font-weight:800;color:var(--canon);font-size:.9em;margin-bottom:4px;">Clica para gerar ideia.</div>
          <div id="suggestionText" style="font-style:italic;min-height:48px;line-height:1.4;font-size:.9em;"></div>
          <button class="btn btn-sm btn-secondary" id="suggestBtn">Gerar ideia</button>
        </div>

        <div class="title">Episódio</div>
        <div class="field">
          <label>Nome do episódio</label>
          <input id="episodeName" placeholder="Ex: O Grande Plano 1" />
        </div>
        <div class="field">
          <label>Premissa</label>
          <textarea id="premise" placeholder="Escreve a premissa..."></textarea>
        </div>
        <button class="btn" id="aiGenerateBtn">✨ Gerar episódio com IA</button>
        <button class="btn btn-sm btn-secondary" id="aiStoryBtn" title="Reescreve a história do episódio atual com IA (Gemini). Falhas aparecem aqui, nunca em silêncio.">✨ IA: reescrever história</button>
        <div id="status"></div>
        <div id="audit"></div>

        <div class="title">Backend</div>
        <div class="field">
          <label>URL do backend</label>
          <input id="backendUrl" value="/api" />
          <div class="hint">Para imagens reais, serve pelo backend e abre http://localhost:8787. Não uses file://.</div>
        </div>
        <div class="field">
          <label>Fornecedor</label>
          <select id="providerSelect">
            <option value="gemini">Google Gemini (Nano Banana)</option>
            <option value="openai">OpenAI (gpt-image)</option>

    let REPO_EPISODES = [{"number":1,"title":"A Rainha dos Reality-Shows","status":"Decupagem completa para produção","path":"Temporadas/Temporada-1/episodio-01-a-rainha-dos-reality-shows.md","kind":"guião","decoupageStatus":"Completa","decoupagePath":"docs/episodios/T1E01-a-rainha-dos-reality-shows-decupagem.md","content":"# Episódio 1 — A Rainha dos Reality-Shows\n\n## Ficha de produção\n\n- **Formato:** sitcom animada narrativa\n- **Duração-alvo:** 60–90 segundos\n- **Estado:** versão consolidada aprovada para implementação\n- **Personagens:** Teresa, Tininha, Capitão Gancho, rececionista e fã\n- **Locais:** exterior e entrada da TVI, receção, corredor e gabinete do Capitão Gancho\n\n## Premissa\n\nTeresa regressa à TVI convencida de que continua a ser a escolha óbvia para apresentar o Secret Story. Tenta vender o seu regresso como a solução para recuperar audiências, mas a entrada de Tininha e a revelação do título da nova edição mostram-lhe que já não é o centro das decisões. À saída, uma fã reconhece-a e devolve-lhe, por instantes, a sensação de continuar a ser a rainha dos reality-shows.\n\n## Cena 1 — Exterior da TVI — Dia\n\nA fachada da TVI está vazia. Não há personagens, diálogo ou voz off. A câmara aproxima-se ligeiramente da entrada.\n\nCorte.\n\n## Cena 2 — Entrada e receção — Dia\n\nTeresa entra no edifício com a postura de quem regressa a um lugar que lhe pertence. Dirige-se à receção.\n\n**RECECIONISTA:** «Desculpe, tem marcação?»\n\n**TERESA:** «Tenho assuntos a tratar com o Capitão Gancho.»\n\n**RECECIONISTA:** «Sem marcação não pode passar.»\n\nA rececionista tenta impedir-lhe a passagem.\n\n**TERESA:** «Sabe quem eu sou? Ou já apagaram a memória desta casa?»\n\nTeresa não espera pela resposta. Salta os torniquetes e segue caminho. A rececionista fica para trás, sem reação.\n\n## Cena 3 — Corredor da TVI — Dia\n\nTeresa atravessa o corredor em direção ao gabinete, determinada a conseguir o que veio procurar. Sem diálogo; a passagem é breve.\n\n## Cena 4 — Gabinete do Capitão Gancho — Dia\n\nO Capitão está sentado à secretária. Teresa apresenta-se com confiança.\n\n**TERESA:** «O programa precisa de voltar às origens. E ninguém conhece aquelas origens como eu.»\n\n**CAPITÃO GANCHO:** «Vamos analisar as possibilidades.»\n\nO Capitão mantém-se frio e profissional. Teresa interpreta a resposta como uma abertura.\n\nTininha entra com uma pasta.\n\n**TININHA:** «Olhe, ainda sabe o caminho para aqui?»\n\nTeresa vira-se para ela, visivelmente irritada.\n\n**TERESA:** «Sei. Ao contrário de algumas pessoas, não preciso de GPS para chegar ao topo.»\n\nTininha não prolonga a provocação. Dirige-se ao Capitão e coloca a pasta sobre a secretária.\n\n**TININHA:** «Capitão, trouxe as propostas para o nome da nova edição.»\n\n**CAPITÃO GANCHO:** «Vamos ver.»\n\nTininha abre a pasta e consulta os documentos.\n\n**TININHA:** «Eu continuo a gostar de “Secret Story: Luta pelo Desafio Final All Stars”. É forte.»\n\nTeresa olha para a pasta e depois para Tininha, perplexa.\n\n**TERESA:** «Valha-me Deus… Isso explica muita coisa.»\n\nO Capitão olha discretamente para Tininha, reconhecendo que é ela quem está a conduzir aquele trabalho. Não toma partido nem comenta a provocação.\n\nTeresa percebe que deixou de ser o centro da reunião. Dirige-se à porta.\n\nJá à saída, vira ligeiramente a cabeça e lança a ameaça com dramatismo contido.\n\n**TERESA:** «Ainda se vão arrepender…»\n\nSai.\n\n## Cena 5 — Exterior da TVI — Dia\n\nTeresa sai do edifício. Uma fã reconhece-a espontaneamente e aproxima-se, genuinamente entusiasmada.\n\n**FÃ:** «Você devia voltar! É a rainha dos reality-shows!»\n\nTeresa fica emocionada. Os olhos enchem-se de lágrimas e leva a mão ao peito.\n\n**VOZ OFF FEMININA, doce e emotiva:** «Há coroas que o tempo não consegue tirar…»\n\n**TERESA (com a voz a tremer):** «Eu sabia… Eu sabia que ainda não se tinham esquecido de mim.»\n\nA câmara aproxima-se ligeiramente. Teresa sorri entre lágrimas, recompõe a postura e ergue o queixo, recuperando a pose de rainha.\n\n**CORTE PARA PRETO.**\n\n## Regras de continuidade\n\n- O plano inicial mostra apenas o exterior da TVI, sem personagens, diálogo ou voz off.\n- Reutilizar os cenários, referências e master frames existentes.\n- No gabinete, o master angle é o plano principal. Os únicos ângulos adicionais de diálogo disponíveis são o plano de Capitão Gancho sentado e o inverso de Teresa.\n- Não criar shot/reverse-shot automático para cada fala. Acrescentar planos de reação apenas quando forem importantes para a piada ou para a emoção.\n- O salto dos torniquetes deve ser visualmente claro; criar um plano adicional apenas se o master não mostrar a ação com clareza.\n- Capitão Gancho é calmo, frio e político; nunca grita.\n- Manter o tratamento formal entre as personagens, mesmo nas provocações.\n- O título da nova edição é revelado verbalmente. A pasta e os documentos são adereços naturais; não é necessário que o título esteja legível.\n- A fã diz exatamente: «Você devia voltar! É a rainha dos reality-shows!»\n- A voz off final é feminina, doce e emotiva.\n- A Abelha Maia não aparece nem narra este episódio.\n- Todas as falas são em português europeu (PT-PT).\n","decoupageContent":"<!-- OS_LESADOS_DECOUPAGE_STATUS: COMPLETE -->\n# OS LESADOS\n## Temporada 1 · Episódio 1 — A Rainha dos Reality-Shows\n### Guião técnico e decupagem de produção\n\n**Estado:** consolidada segundo a versão aprovada  \n**Idioma:** português europeu (PT-PT)  \n**Estilo:** sitcom de animação 2D  \n**Duração-alvo:** 60–90 segundos; durações por plano indicativas, ajustadas à interpretação e montagem.\n\n## Regras de realização obrigatórias\n\n1. O episódio começa com um establishing shot do exterior da TVI sem personagens, diálogo ou voz off. Aplicar um ligeiro zoom in.\n2. Reutilizar os master frames, referências de personagens e cenários existentes. Não criar novas imagens ou reframes sem necessidade narrativa.\n3. No gabinete do Capitão Gancho, usar o master angle existente como plano principal. Os ângulos adicionais de diálogo disponíveis são o plano do Capitão sentado e o inverso de Teresa.\n4. Não criar shot/reverse-shot automático para cada fala. Um plano de reação só é necessário quando uma expressão for importante para a piada ou para a emoção.\n5. Um take aguenta duas falas e 8 segundos. Um plano com três ou mais falas, ou mais de 8 segundos, tem de ser dividido em pelo menos dois planos (ex.: 02A, 02B, 02C).\n6. Dois planos seguidos da mesma cena nunca repetem o enquadramento: quando se divide um plano, o seguinte muda de ângulo e de eixo. Ações físicas, em particular o salto dos torniquetes, têm de ser legíveis num plano de ação próprio.\n7. Preservar geografia, posições, direção dos olhares, iluminação, mobiliário, roupa e desenho das personagens. Os planos de ação usam os elementos que já existem no master frame (o salto usa os torniquetes de vidro já visíveis), nunca adereços novos.\n8. Todas as falas são em PT-PT. Não adicionar narração da Abelha Maia; a personagem não aparece neste episódio.\n9. O título da nova edição é revelado verbalmente. A pasta é um adereço natural; não é necessário um grande plano nem texto legível.\n10. Priorizar ritmo rápido e pausas curtas. O momento emocional da fã é a pausa mais prolongada do episódio.\n\n---\n\n# CENA 1 — EXT. ENTRADA DA TVI — DIA\n\n**Objetivo:** estabelecer o local antes de a ação começar.\n\n## PLANO 01 — Establishing shot da TVI\n\n**01A · ESTABLISHING SHOT**  \n**Duração estimada:** 4–5 s  \n**Câmara:** plano geral com ligeiro zoom in  \n**Personagens:** nenhuma\n\n**Prompt de imagem**\n> Wide establishing shot of the exterior entrance of a Portuguese television broadcasting headquarters, modern glass and stone facade, television-studio entrance, daytime, clean 2D sitcom animation style, simple cinematic composition, no people, no characters, no silhouettes, no readable text, 16:9.\n\n**Prompt de animação**\n> Hold on the empty exterior of the television headquarters. Apply a very subtle slow zoom-in to establish the location. Only minimal environmental movement, if any. No characters enter the frame. No dialogue, no voice-over and no music cue required.\n\n**Transição:** corte direto para Teresa a entrar no edifício.\n\n---\n\n# CENA 2 — INT. ENTRADA, RECEÇÃO E ACESSOS DA TVI — DIA\n\n**Objetivo:** apresentar Teresa e mostrar, através de comédia física, que já não tem os privilégios que espera.\n\n## PLANO 02 — Teresa chega à receção e salta os torniquetes\n\n**02A · MASTER FRAME DA RECEÇÃO**  \n**Duração estimada:** 5–6 s  \n**Câmara:** plano geral frontal que inclua entrada, receção, rececionista e torniquetes  \n**Personagens:** Teresa e rececionista\n\n**Prompt de imagem**\n> Wide frontal master shot of a modern Portuguese television station reception lobby. Clearly show the entrance, reception desk, receptionist and the glass access turnstiles in one coherent composition. Teresa enters with a regal, self-important posture, wearing her established character design and outfit. Clean 2D sitcom animation style, readable staging, 16:9.\n\n**Prompt de animação**\n> Teresa enters the building and approaches the reception desk as if she expects immediate recognition. The receptionist calmly asks whether she has an appointment. Teresa says she has business with Captain Hook. Keep the wide frontal composition throughout; no cuts and no change of angle.\n\n**RECECIONISTA:** «Desculpe, tem marcação?»\n\n**TERESA:** «Tenho assuntos a tratar com o Capitão Gancho.»\n\n**02B · PLANO MÉDIO DA RECEÇÃO — O IMPEDIMENTO (ângulo diferente do master)**  \n**Duração estimada:** 4–5 s  \n**Câmara:** plano médio do lado da rececionista, sobre o ombro dela, virado para Teresa  \n**Personagens:** Teresa e rececionista\n\n**Prompt de imagem**\n> Medium shot from the receptionist's side of the desk, framed over her shoulder towards Teresa, inside the same Portuguese television station reception lobby. Same desk, same lighting, same characters and the same wardrobe as the wide master shot. Teresa is mid-complaint with her chin high; the receptionist has one hand raised to stop her. Clean 2D sitcom animation style, 16:9.\n\n**Prompt de animação**\n> The receptionist tells her she cannot pass without an appointment and moves to block her. Teresa looks at the receptionist with offended disbelief and delivers her sharp line. Hold this medium angle; do not cut back to the wide master.\n\n**RECECIONISTA:** «Sem marcação não pode passar.»\n\n**TERESA:** «Sabe quem eu sou? Ou já apagaram a memória desta casa?»\n\nA rececionista tenta impedir-lhe a passagem.\n\n**02C · PLANO DE AÇÃO — O SALTO DOS TORNIQUETES**  \n**Duração estimada:** 3–4 s  \n**Câmara:** plano geral lateral dos torniquetes, para a ação ficar inteiramente legível  \n**Personagens:** Teresa e rececionista\n\n**Prompt de imagem**\n> Wide lateral shot of the same reception lobby seen from the side, framing the glass access turnstiles that are already behind Teresa in the master shot. Teresa is already airborne mid-jump over one of those existing glass turnstiles, legs clear of the glass panels, still composed and regal. The receptionist stands back at the desk, watching. Same characters, wardrobe, lighting and set as the previous shots. Clean 2D sitcom animation style, 16:9.\n\n**Prompt de animação**\n> Teresa does not wait for an answer: she clears the glass turnstile that is already in the first frame — the same barrier she was standing next to, with the same glass panels, same position and same design — in one decisive movement, then continues on her way. The receptionist is left behind, watching without reacting. Keep the lateral wide angle and the existing turnstiles visible and unchanged throughout the jump, so the action is fully readable.\n\n**Ação:** Teresa salta os torniquetes e segue caminho. A rececionista fica para trás, sem reação.\n\n---\n\n# CENA 3 — INT. CORREDOR DA TVI — DIA\n\n**Objetivo:** levar Teresa ao gabinete sem prolongar desnecessariamente a deslocação.\n\n## PLANO 03 — Teresa atravessa o corredor\n\n**03A · MASTER FRAME DO CORREDOR**  \n**Duração estimada:** 3–4 s  \n**Câmara:** plano geral ou médio aberto; movimento discreto se necessário  \n**Personagens:** Teresa\n\n**Prompt de imagem**\n> Wide view of an interior corridor in the same Portuguese television station, with doors and understated production-office details. Teresa walks confidently through the corridor, holding her head high as if she still belongs at the centre of television. Preserve her established character design and outfit. Clean 2D sitcom style, 16:9.\n\n**Prompt de animação**\n> Teresa walks purposefully down the corridor. A subtle tracking movement may follow her, but a static composition is also acceptable. She does not stop or interact with anyone. Keep the shot brief and transition naturally to the office. No dialogue or voice-over.\n\n---\n\n# CENA 4 — INT. GABINETE DO CAPITÃO GANCHO — DIA\n\n**Objetivo:** Teresa tenta convencer o Capitão de que o Secret Story precisa de regressar às origens e de que ela é a escolha certa. Tininha entra com a pasta e revela o título da nova edição.\n\n**Continuidade obrigatória:** usar o master angle existente do gabinete. Manter a secretária, a cadeira do Capitão, a porta, o mobiliário e a iluminação exatamente como nas referências.\n\n## PLANO 04 — A proposta de Teresa\n\n**04A · MASTER FRAME EXISTENTE**  \n**Duração estimada:** 6–8 s  \n**Câmara:** master angle do gabinete  \n**Personagens:** Capitão Gancho e Teresa\n\n**Prompt de imagem**\n> Use the existing master-angle reference image of Captain Hook's office. Preserve the exact room layout, desk, chair, door, furniture, lighting, proportions and 2D animation style. Captain Hook sits behind the desk. Teresa stands opposite him with confident, self-important posture. Do not redesign the office.\n\n**Prompt de animação**\n> Teresa speaks with total conviction, as though her return is an obvious solution for the show. Captain Hook listens calmly and professionally without promising anything or raising his voice. Keep the exchange in the existing master angle, with restrained movement and natural dialogue timing. European Portuguese lip sync.\n\n**TERESA:** «O programa precisa de voltar às origens. E ninguém conhece aquelas origens como eu.»\n\n**CAPITÃO GANCHO:** «Vamos analisar as possibilidades.»\n\nTeresa interpreta a resposta como uma abertura.\n\n## PLANO 05 — Entrada de Tininha e provocação\n\n**05A · CONTINUAÇÃO DO MASTER FRAME EXISTENTE**  \n**Duração estimada:** 6–8 s  \n**Câmara:** manter o master angle, incluindo a porta se a composição o permitir  \n**Personagens:** Teresa, Tininha e Capitão Gancho\n\n**Prompt de imagem**\n> Use the existing master angle of Captain Hook's office. Captain Hook remains seated behind the desk and Teresa stands opposite him. Tininha enters through the established office door carrying a folder. Preserve all character designs, room geography, lighting and furniture. Do not create a new office layout.\n\n**Prompt de animação**\n> Tininha enters carrying a folder and immediately addresses Teresa with a pointed, dry remark. Teresa turns to face her and replies with a short, cutting line. Tininha does not prolong the argument; she turns to Captain Hook and approaches the desk. Keep the entire exchange in the master angle if possible. Use a reaction angle only if Teresa's expression is essential to the joke.\n\n**TININHA:** «Olhe, ainda sabe o caminho para aqui?»\n\n**TERESA:** «Sei. Ao contrário de algumas pessoas, não preciso de GPS para chegar ao topo.»\n\nTininha coloca a pasta sobre a secretária e dirige-se ao Capitão.\n\n## PLANO 06 — Revelação do título\n\n**06A · MASTER FRAME EXISTENTE**  \n**Duração estimada:** 5–6 s  \n**Câmara:** master angle do gabinete; documentos visíveis naturalmente  \n**Personagens:** Teresa, Tininha e Capitão Gancho\n\n**Prompt de animação**\n> Continue from the exact previous master angle and character positions. Tininha presents the folder to Captain Hook and explains that she has brought title proposals for the new edition. Captain Hook replies calmly. Keep the master angle for this beat.\n\n**TININHA:** «Capitão, trouxe as propostas para o nome da nova edição.»\n\n**CAPITÃO GANCHO:** «Vamos ver.»\n\n**06B · PLANO MÉDIO DE TININHA — O TÍTULO (ângulo diferente do master)**  \n**Duração estimada:** 5–6 s  \n**Câmara:** plano médio de Tininha com a pasta, do lado oposto ao master angle  \n**Personagens:** Teresa, Tininha e Capitão Gancho\n\n**Prompt de imagem**\n> Use the existing office set, furniture, lighting and character designs of the master angle. Medium shot of Tininha framed from the opposite side of the desk, opening the folder and reading from it. Teresa is visible at the edge of the frame, perplexed; Capitão Gancho watches calmly. Do not redesign the office. Clean 2D sitcom animation style, 16:9.\n\n**Prompt de animação**\n> Tininha opens the folder and reads her preferred title aloud. Teresa looks from the folder to Tininha, visibly perplexed. Captain Hook briefly looks towards Tininha, acknowledging that she is leading this work. Keep this medium angle; the documents remain a natural prop and no readable on-screen title is required.\n\n**TININHA:** «Eu continuo a gostar de “Secret Story: Luta pelo Desafio Final All Stars”. É forte.»\n\n**TERESA:** «Valha-me Deus… Isso explica muita coisa.»\n\nO Capitão olha discretamente para Tininha, sem comentar nem tomar partido.\n\n## PLANO 07 — Saída de Teresa\n\n**07A · MASTER FRAME EXISTENTE**  \n**Duração estimada:** 6–8 s  \n**Câmara:** manter o master angle até Teresa chegar à porta; usar o inverso de Teresa apenas se necessário para tornar a expressão legível\n\n**Prompt de animação**\n> Continue in the established office master angle. Teresa realizes she is no longer the centre of the meeting, turns and walks towards the door. When she reaches the doorway, she slightly turns her head and delivers a theatrical but controlled threat, audible to the audience. Captain Hook remains calm and does not respond. Teresa exits. No extra dialogue, no shouting and no unnecessary camera cuts.\n\n**TERESA:** «Ainda se vão arrepender…»\n\nTeresa sai do gabinete.\n\n---\n\n# CENA 5 — EXT. ENTRADA DA TVI — DIA\n\n**Objetivo:** terminar com uma pequena vitória emocional de Teresa. A admiração genuína da fã permite-lhe acreditar que continua a ser a rainha dos reality-shows.\n\n## PLANO 08 — A fã reconhece Teresa\n\n**08A · MASTER FRAME EXTERIOR**  \n**Duração estimada:** 6–8 s  \n**Câmara:** plano conjunto de Teresa e da fã  \n**Personagens:** Teresa e fã\n\n**Prompt de imagem**\n> Medium-wide shot outside the same television station entrance established in the opening. Teresa exits the building and a female fan recognizes her and approaches with genuine excitement. Preserve Teresa's established character design and outfit and the existing exterior environment. Both characters should be clearly visible in the same composition. Clean 2D sitcom style, 16:9.\n\n**Prompt de animação**\n> Teresa exits with her head held high, trying to hide her disappointment. A fan recognizes her spontaneously, approaches and speaks with sincere enthusiasm. Teresa stops, surprised and moved. Her eyes begin to glisten and she brings one hand to her chest. Keep the emotion sincere, with subtle comic contrast rather than exaggerated parody.\n\n**FÃ:** «Você devia voltar! É a rainha dos reality-shows!»\n\n## PLANO 09 — A coroa que o tempo não tira\n\n**09A · CONTINUAÇÃO DO MASTER FRAME / LIGEIRO ZOOM IN**  \n**Duração estimada:** 8 s  \n**Câmara:** continuar a mesma composição e aproximar ligeiramente a câmara de Teresa  \n**Personagens:** Teresa; manter a fã no enquadramento se a composição o permitir\n\n**Prompt de animação**\n> Continue directly from the previous shot. As Teresa becomes emotional, a sweet female voice-over begins. Teresa's eyes glisten with tears and her hand remains over her chest. She speaks with a trembling voice, then smiles through her tears, straightens her posture and raises her chin, regaining her regal pose. Apply a subtle slow zoom-in. Keep the moment sincere and concise. No cutaway, no additional character and no extra narration. End with a clean cut to black.\n\n**VOZ OFF FEMININA, doce e emotiva:** «Há coroas que o tempo não consegue tirar…»\n\n**TERESA, com a voz a tremer:** «Eu sabia… Eu sabia que ainda não se tinham esquecido de mim.»\n\nTeresa sorri entre lágrimas, recompõe a postura e ergue o queixo.\n\n**CORTE PARA PRETO.**\n\n---\n\n## Notas finais de produção\n\n- **Establishing shot:** exterior da TVI vazio, sem personagens, diálogo ou voz off.\n- **Receção:** cobertura em três planos (02A master frontal, 02B plano médio do lado da rececionista, 02C plano de ação lateral). A entrada, a tentativa de impedir Teresa e o salto dos torniquetes formam uma sequência clara, sempre com mudança de ângulo entre planos. O salto usa os **torniquetes de vidro que já existem no master** — a mesma barreira, na mesma posição e com o mesmo desenho, nunca uma barreira nova.\n- **Gabinete:** master angle como base. Usar apenas os ângulos existentes do Capitão sentado e o inverso de Teresa quando uma reação importante o justificar.\n- **Documentos:** a pasta é visível, mas o título não tem de ser legível; a revelação é verbal.\n- **Tratamento:** manter registo formal entre personagens, mesmo nas provocações.\n- **Final:** uma única cena exterior, com reconhecimento sincero da fã, voz off feminina doce e resposta emocionada de Teresa.\n- **Abelha Maia:** não aparece nem narra este episódio.\n- **Continuidade visual:** preservar as referências existentes de personagens, roupa, acessórios e cenários.\n- **Montagem:** falas concisas, pausas cómicas curtas e a pausa emocional principal reservada ao final. Evitar planos redundantes e duração artificial.\n"},{"number":2,"title":"Roda Capitão","status":"Guião em revisão · texto integral por consolidar","path":"Temporadas/Temporada-1/episodio-02-roda-capitao.md","kind":"ficha","content":"# Episódio 2 — Roda Capitão\n\n## Ficha de produção\n\n- **Formato:** Sitcom animada narrativa\n- **Duração prevista:** Por definir após recuperar o guião integral\n- **Estado do guião:** Guião integral por recuperar/consolidar\n- **Personagens:** Capitão Gancho, Tininha; Teresa Guilhermina I de Portugal apenas no final\n- **Cenários/localizações:** Por confirmar a partir do guião integral; confronto Gancho/Tininha e cena final separada de Teresa\n- **Estado do texto:** Ficha de continuidade; não contém o guião integral\n- **Som e efeitos:** Por definir após consolidação do guião\n- **Nota de produção:** Não inventar diálogos para preencher lacunas. Abelha Maia não é narradora automática. Preservar a nota de remate registada no documento.\n\n> A duração é uma estimativa de trabalho, não uma duração final medida. Atualizar após fechar o guião e aprovar a decupagem.\n\n\n**Estado:** guião em revisão; texto integral por consolidar  \n**Tipo:** ficha de continuidade para recuperar a versão aprovada antes de storyboard e animação.\n\n## Premissa e conflito\n\nO episódio centra-se no confronto entre Capitão Gancho e Tininha. Teresa Guilhermina não participa nesse confronto: só deve aparecer no final, numa cena separada que funciona como remate e deixa aberta a continuação da intriga.\n\n## Continuidade obrigatória\n\n- **Teresa fica fora do confronto Gancho/Tininha.** A sua única aparição neste episódio é no final.\n- **Abelha Maia não é narradora automática.** Só aparece se a história precisar dela; não acrescentar abertura ou fecho em voz-off por rotina.\n- Evitar a palavra **«pivot»** sem contexto. Reformular em português claro, adequado à situação televisiva.\n- A métrica **«0,3»** não pode surgir isolada. Se for importante para a piada, explicar a que se refere e em que unidade/escala é medida; caso contrário, retirar.\n- Preservar a indicação de remate recebida: **«Acabado. Tininha — madrugada. Guilhermina — a porta.»** Não transformar esta nota em diálogo nem alterar o seu sentido sem recuperar o guião integral.\n\n## Antes de produzir imagens\n\nA versão integral do guião usado na revisão anterior não está disponível neste documento. Esta ficha regista as correções de continuidade conhecidas, mas **não substitui o guião completo nem autoriza a reconstrução de diálogos por adivinhação**.\n\nQuando o texto integral estiver consolidado:\n1. aprovar a narrativa completa;\n2. dividir em cenas com ações e diálogos específicos;\n3. enviar as cenas aprovadas para o Pipeline;\n4. gerar e aprovar cada imagem individualmente;\n5. só depois disponibilizar o prompt de animação correspondente na aba Video.\n","decoupageContent":null},{"number":3,"title":"Monte do Coxa","status":"Decupagem completa para produção","path":"Temporadas/Temporada-1/episodio-03-monte-do-coxa.md","kind":"guião","decoupagePath":"docs/episodios/T1E03-monte-do-coxa-decupagem.md","decoupageStatus":"Completa","content":"# Episódio 3 — Monte do Coxa\n\n## Ficha de produção\n\n- **Formato:** sitcom animada narrativa, comédia visual e física.\n- **Duração-alvo:** 1–2 minutos; confirmar após montagem.\n- **Estado:** decupagem completa para produção.\n- **Personagens:** Coxa, Capitão Gancho e caseiro (apenas na chegada).\n- **Cenários:** escritório do Monte do Coxa, entrada e caminhos rurais, Mercedes preto.\n- **Idioma:** português europeu (PT-PT).\n- **Regra de câmara:** plano-mestre primeiro; reframes apenas quando necessários para uma fala, reação ou gag física.\n\n## Premissa\n\nCoxa aproveita as férias no escritório do seu monte alentejano, longe da televisão. A tranquilidade termina quando Capitão Gancho chega num Mercedes preto para o convencer a regressar mais cedo à TVI. Coxa recusa, foge pelo monte e desencadeia uma sequência rápida de gags físicas com galinhas, um cavalo e um balde de milho. Gancho não perde a calma. Coxa ameaça ir para a SIC apenas para o provocar. A cena final começa com Coxa já dentro da mala do Mercedes, a gritar, enquanto Gancho justifica a decisão com a necessidade de ter audiências.\n\n## Sequência narrativa aprovada\n\n### 1. A tranquilidade\n\nCoxa está sozinho no escritório do monte, a aproveitar as férias. Uma única voz off feminina, doce e irónica, abre o episódio:\n\n**VOZ OFF:** «Coxa aproveita a tranquilidade do monte. Finalmente, uns dias sem reuniões, sem diretos e sem ninguém a pedir-lhe audiências.»\n\nNão há narração recorrente nem participação automática da Abelha Maia.\n\n### 2. A chegada do Mercedes\n\nUm Mercedes preto entra na propriedade e é obrigado a parar porque as galinhas atravessam o caminho. Capitão Gancho está ao volante. O caseiro aproxima-se e trata-o por «Doutor».\n\n**CASEIRO:** «Bom dia, Doutor.»  \n**CAPITÃO GANCHO:** «Bom dia. O Coxa está?»  \n**CASEIRO:** «Está no escritório, Doutor.»\n\n### 3. O encontro e a recusa\n\nCoxa sai do escritório e encontra Gancho no exterior.\n\n**CAPITÃO GANCHO:** «Coxa. Preciso que regresse mais cedo.»  \n**COXA:** «Mais cedo? Ainda agora comecei as férias.»  \n**CAPITÃO GANCHO:** «A sua presença faz falta na TVI.»  \n**COXA:** «Então a TVI vai ter de aprender a viver sem mim durante uns dias.»  \n**CAPITÃO GANCHO:** «Não vim pedir-lhe uma opinião. Vim buscá-lo.»\n\n### 4. A fuga pelo monte\n\nCoxa foge. As galinhas atravessam-lhe o caminho, um cavalo bloqueia a passagem e, ao olhar para trás, Coxa não vê um balde cheio de milho e cai lá dentro.\n\n**COXA:** «Isto é um pesadelo!»  \n**CAPITÃO GANCHO:** «Vejo que está a aproveitar bem as férias.»  \n**COXA:** «Nem uma palavra!»\n\n### 5. A decisão de Gancho\n\nCoxa consegue sair do balde, coberto de milho, e recusa-se a regressar.\n\n**COXA:** «Eu não vou consigo. Estou de férias.»  \n**CAPITÃO GANCHO:** «Compreendo.»  \n**COXA:** «E, se continuar com isto, ainda me convence a ir para a SIC!»  \n**CAPITÃO GANCHO:** «Vamos.»\n\nGancho decide pessoalmente levar Coxa, sem explicar o que vai fazer e sem perder a calma. Não mostrar como Coxa vai parar à mala.\n\n### 6. A mala\n\nA cena começa com Coxa já dentro da mala aberta do Mercedes.\n\n**COXA:** «TIREM-ME DAQUI!»  \n**CAPITÃO GANCHO:** «Preciso de ter audiências.»\n\nO Mercedes afasta-se enquanto Coxa continua a gritar. Corte para preto.\n\n## Regras de continuidade\n\n- Coxa continua a ser funcionário da TVI e está apenas de férias.\n- A ameaça de ir para a SIC é uma provocação, não uma decisão real.\n- Capitão Gancho é calmo, frio e burocrático; não grita nem perde a compostura.\n- O caseiro só aparece na chegada e trata Gancho por «Doutor».\n- Coxa e Gancho usam tratamento formal.\n- O final começa com Coxa já dentro da mala; não mostrar como foi colocado lá.\n- Não acrescentar a Abelha Maia nem uma voz off recorrente.\n- Não inventar biografia, roupa ou características vocais para Coxa.\n- A decupagem completa, com prompts de imagem e animação, está em `docs/episodios/T1E03-monte-do-coxa-decupagem.md`.\n","decoupageContent":"<!-- OS_LESADOS_DECOUPAGE_STATUS: COMPLETE -->\n# OS LESADOS\n## Temporada 1 · Episódio 3 — Monte do Coxa\n### Guião técnico e decupagem · planos-mestre, reframes necessários e prompts de imagem/animação\n\n**Estado:** decupagem completa para produção  \n**Duração-alvo:** 1–2 minutos, a confirmar na montagem  \n**Idioma das falas:** português europeu (PT-PT)  \n**Personagens:** Coxa, Capitão Gancho, caseiro (apenas na chegada)  \n**Cenários:** escritório do Monte do Coxa, entrada e caminhos rurais, Mercedes preto  \n**Regra de continuidade:** esta versão substitui a história-base anterior quando há diferenças. Não mostrar como Coxa vai parar à mala.  \n**Regra de câmara:** estabelecer cada cena com um plano-mestre. Criar reframes apenas quando são necessários para uma fala, reação ou gag física. Não criar inserts decorativos.\n\n> Os prompts são instruções de produção. Usar as referências canónicas existentes para Coxa e Capitão Gancho. Não inventar roupa, biografia ou características vocais para Coxa.\n\n---\n\n## CENA 1 — A tranquilidade de Coxa\n\n### PLANO 01 — Escritório do monte\n**Tipo:** MASTER FRAME  \n**Câmara:** plano médio-aberto fixo  \n**Duração estimada:** 8–10 s  \n**Personagens:** Coxa  \n**Ação:** Coxa está sozinho no escritório, a aproveitar a tranquilidade das férias. A secretária, alguns papéis e a janela para o campo estabelecem o espaço. A voz off só existe nesta abertura. Coxa não fala.\n\n**VOZ OFF FEMININA (doce, irónica, PT-PT):**  \n«Coxa aproveita a tranquilidade do monte. Finalmente, uns dias sem reuniões, sem diretos e sem ninguém a pedir-lhe audiências.»\n\n**Prompt de imagem**\n> Create a polished 2D adult animated sitcom master frame of Coxa relaxing inside his office at Monte do Coxa, a rural Portuguese estate. Use the established canonical reference for Coxa and preserve his exact face, hairstyle, body proportions and clothing. Comfortable, quiet office with a desk, a few papers and a window overlooking the countryside. Medium-wide composition, clear staging, consistent perspective, clean outlines and a sophisticated television-cartoon aesthetic. Coxa is alone and visibly enjoying the peace. No extra characters, no readable text, no subtitles, no logos. 16:9.\n\n**Prompt de animação**\n> Animate a restrained, peaceful opening shot. Coxa relaxes naturally in his office and makes one small casual movement while enjoying the quiet. Very subtle environmental movement outside the window. Keep the camera locked off; no unnecessary zooms or cuts. A sweet, lightly ironic female voice-over in European Portuguese (PT-PT) says: “Coxa aproveita a tranquilidade do monte. Finalmente, uns dias sem reuniões, sem diretos e sem ninguém a pedir-lhe audiências.” Coxa does not speak. This is the only narration in the episode.\n\n**Reframes:** nenhum. O plano-mestre já conta toda a informação necessária.\n\n---\n\n## CENA 2 — O Mercedes chega\n\n### PLANO 02 — Entrada da propriedade\n**Tipo:** MASTER FRAME  \n**Câmara:** plano geral fixo  \n**Duração estimada:** 8–12 s  \n**Personagens:** Capitão Gancho, caseiro  \n**Ação:** Um Mercedes preto entra na propriedade e tem de parar porque as galinhas atravessam o caminho. Capitão Gancho está ao volante, impassível. O caseiro aproxima-se da janela.\n\n**CASEIRO:** «Bom dia, Doutor.»  \n**CAPITÃO GANCHO:** «Bom dia. O Coxa está?»  \n**CASEIRO:** «Está no escritório, Doutor.»\n\nGancho olha para as galinhas e espera que a passagem fique livre, sem mostrar irritação.\n\n**Prompt de imagem**\n> Create a polished 2D animated sitcom master frame of a black Mercedes arriving at the entrance of a rustic Portuguese rural estate. Several chickens cross the driveway directly in front of the car. Capitão Gancho, using his established canonical character reference and clothing, is visible inside the vehicle, calm and composed. The caretaker stands beside the driver's window. Establish the car, driveway, entrance and countryside clearly in one coherent composition. No other characters, no readable text, no subtitles. 16:9.\n\n**Prompt de animação**\n> The black Mercedes drives slowly into the estate and comes to a complete stop as chickens casually cross in front of it. Capitão Gancho remains perfectly calm behind the wheel. The caretaker approaches the driver's window. In European Portuguese (PT-PT), the caretaker says: “Bom dia, Doutor.” Gancho replies evenly: “Bom dia. O Coxa está?” The caretaker answers: “Está no escritório, Doutor.” Natural lip sync and restrained body language. No shouting, no invented dialogue.\n\n### 02A — REFRAME: as galinhas\n**Origem:** 02 · **Tipo:** reframe digital, se a resolução permitir  \n**Necessidade:** tornar legível a gag que obriga o carro a parar.\n\n**Prompt de reframe**\n> Reframe the existing master image towards the front of the black Mercedes and the chickens crossing directly in front of its wheels. Preserve the same car, road, lighting, perspective and direction of movement. Do not add new elements.\n\n**Prompt de animação**\n> The chickens cross at an unhurried pace while the Mercedes remains completely stopped. Capitão Gancho waits without reacting. Keep the physical gag brief and visually clear.\n\n---\n\n## CENA 3 — Coxa encontra Gancho\n\n### PLANO 03 — Encontro no exterior\n**Tipo:** MASTER FRAME  \n**Câmara:** plano conjunto médio-aberto  \n**Duração estimada:** 15–20 s  \n**Personagens:** Coxa, Capitão Gancho  \n**Ação:** Coxa sai do escritório para perceber a chegada e encontra Gancho no exterior. Percebe que a visita não é social.\n\n**CAPITÃO GANCHO:** «Coxa. Preciso que regresse mais cedo.»  \n**COXA:** «Mais cedo? Ainda agora comecei as férias.»  \n**CAPITÃO GANCHO:** «A sua presença faz falta na TVI.»  \n**COXA:** «Então a TVI vai ter de aprender a viver sem mim durante uns dias.»  \n**CAPITÃO GANCHO:** «Não vim pedir-lhe uma opinião. Vim buscá-lo.»\n\nCoxa começa a afastar-se. Gancho não levanta a voz nem o persegue de forma precipitada.\n\n**Prompt de imagem**\n> Create a polished 2D animated sitcom master frame outside the office at Monte do Coxa. Coxa has just stepped outside and faces Capitão Gancho, who has arrived unexpectedly to bring him back to TVI early from his holidays. Use the canonical character references and preserve exact designs, clothing and proportions. Establish both characters and the rural courtyard in the same frame. Coxa looks reluctant and suspicious; Gancho is composed, authoritative and businesslike. No extra characters, no readable text, no subtitles. 16:9.\n\n**Prompt de animação**\n> Animate a restrained comedic exchange outside the office. Use natural European Portuguese (PT-PT) dialogue and accurate lip sync. Coxa: “Mais cedo? Ainda agora comecei as férias.” Gancho: “A sua presença faz falta na TVI.” Coxa: “Então a TVI vai ter de aprender a viver sem mim durante uns dias.” Gancho: “Não vim pedir-lhe uma opinião. Vim buscá-lo.” Coxa becomes uncomfortable and starts edging away. Gancho remains still and calm, never shouting. Preserve spatial continuity. No extra dialogue.\n\n**Reframes necessários**\n- **03A — Coxa:** reframe médio para a recusa e para a mudança de atitude quando percebe que Gancho está decidido.\n- **03B — Capitão Gancho:** reframe médio para «Não vim pedir-lhe uma opinião. Vim buscá-lo.», com a mesma expressão controlada.\n\n**Prompt de reframe comum**\n> Derive a medium shot from the existing master frame, keeping the same character identity, canonical outfit, lighting, eyeline and position. Do not change the camera axis or invent background details. Frame only the speaking character and enough context to preserve continuity.\n\n**Prompt de animação dos reframes**\n> Use concise shot-reverse-shot coverage. Each character speaks only during their own line. Keep natural European Portuguese lip sync, minimal body movement and clear comic timing. No overlapping dialogue or invented reactions.\n\n---\n\n## CENA 4 — A fuga e o balde de milho\n\n### PLANO 04 — Caos no caminho rural\n**Tipo:** MASTER FRAME / PLANO DE AÇÃO  \n**Câmara:** plano geral de ação  \n**Duração estimada:** 15–20 s  \n**Personagens:** Coxa, Capitão Gancho  \n**Ação:** Coxa foge pelo monte. As gags sucedem-se rapidamente: galinhas atravessam-lhe o caminho; um cavalo bloqueia a passagem; ao olhar para trás para verificar se Gancho o segue, Coxa não vê um balde cheio de milho e cai lá dentro.\n\n**COXA:** «Isto é um pesadelo!»\n\nGancho chega ao local e observa Coxa dentro do balde.\n\n**CAPITÃO GANCHO:** «Vejo que está a aproveitar bem as férias.»  \n**COXA:** «Nem uma palavra!»\n\n**Prompt de imagem**\n> Create a polished 2D adult animated sitcom action master frame in a Portuguese rural farmyard. Coxa is trying to escape along a dirt path. Chickens scatter across the route, a horse blocks a narrow passage, and a large bucket full of yellow corn is placed beside the path. Capitão Gancho follows at a measured pace, still composed. Use established character references and canonical clothing. Arrange the elements so the geography is readable and the physical comedy feels plausible. No extra characters, no readable text, no subtitles. 16:9.\n\n**Prompt de animação**\n> Animate a fast-paced but readable 2D slapstick sequence. Coxa runs to escape. Chickens scatter across his route, forcing him to swerve. He reaches a horse blocking the path and awkwardly tries to get around it. He looks back at Capitão Gancho, fails to notice a large bucket full of corn, trips and falls into it. Corn kernels scatter in an exaggerated cartoon gag. Coxa shouts in European Portuguese (PT-PT): “Isto é um pesadelo!” Gancho arrives and calmly says: “Vejo que está a aproveitar bem as férias.” Coxa, stuck in the bucket, replies: “Nem uma palavra!” Gancho remains expressionless. Clear physical comedy, no realistic injury, no extra dialogue.\n\n**Reframes necessários**\n- **04A — Galinhas:** apenas se o plano-mestre não tornar claro que as galinhas interrompem a fuga.\n- **04B — Cavalo:** apenas se for necessária uma composição separada para mostrar o bloqueio do caminho.\n- **04C — Queda no balde:** plano de ação dedicado, porque a queda precisa de uma composição legível e de movimento próprio.\n\n**Prompt de reframe para a queda**\n> Create a clear action composition derived from the established farmyard layout: Coxa loses his balance while looking backwards and falls into the large bucket of corn. Preserve his exact canonical design and clothing. The bucket and scattered corn must be clearly visible. Exaggerated, harmless cartoon slapstick, no realistic injury, no new characters.\n\n**Prompt de animação da queda**\n> Coxa steps backwards while looking over his shoulder, catches his foot on the bucket and tumbles into it. Corn kernels pop into the air and fall around him. Make the action quick, physically readable and harmless. Do not add extra falls, extra dialogue or additional gags.\n\n---\n\n## CENA 5 — Gancho toma a decisão\n\n### PLANO 05 — Junto ao balde\n**Tipo:** MASTER FRAME  \n**Câmara:** plano conjunto médio-aberto  \n**Duração estimada:** 8–12 s  \n**Personagens:** Coxa, Capitão Gancho  \n**Ação:** Coxa consegue sair do balde, coberto de milho e irritado. Recusa-se definitivamente a regressar. Gancho mantém a calma e decide pessoalmente levá-lo.\n\n**COXA:** «Eu não vou consigo. Estou de férias.»  \n**CAPITÃO GANCHO:** «Compreendo.»  \n**COXA:** «E, se continuar com isto, ainda me convence a ir para a SIC!»\n\nGancho não reage à provocação. Vira-se para o Mercedes.\n\n**CAPITÃO GANCHO:** «Vamos.»\n\nCoxa fica a olhar para ele, confuso. **Corte para a cena final. Não mostrar como Coxa vai parar à mala.**\n\n**Prompt de imagem**\n> Create a polished 2D animated sitcom master frame in the rural courtyard of Monte do Coxa. Coxa has just climbed out of a bucket of corn and is covered in a few corn kernels, frustrated but unharmed. Capitão Gancho stands nearby in his established canonical outfit, calm and authoritative. The black Mercedes is visible in the background. The visual contrast between Coxa's exasperation and Gancho's composure is central. Preserve canonical character identities and clothing. No extra characters, no readable text, no subtitles. 16:9.\n\n**Prompt de animação**\n> Animate a short, tense-comic exchange. Coxa, still covered in corn, says in European Portuguese (PT-PT): “Eu não vou consigo. Estou de férias.” Gancho replies evenly: “Compreendo.” Coxa adds: “E, se continuar com isto, ainda me convence a ir para a SIC!” Gancho ignores the provocation, turns towards the Mercedes and says: “Vamos.” Coxa watches him, confused. Gancho never shouts or becomes visibly angry. End with a clean cut before showing what happens next. No extra dialogue or physical confrontation.\n\n**Reframes:** não são obrigatórios. Usar o plano-mestre sempre que as falas sejam legíveis; só aproximar Gancho se for necessário sublinhar a sua calma.\n\n---\n\n## CENA 6 — A mala do Mercedes\n\n### PLANO 06 — Coxa já está na mala\n**Tipo:** MASTER FRAME  \n**Câmara:** plano médio-aberto do Mercedes com a mala aberta  \n**Duração estimada:** 8–12 s  \n**Personagens:** Coxa, Capitão Gancho  \n**Ação:** A cena começa com Coxa **já dentro da mala aberta**. Não mostrar nem explicar como foi colocado lá.\n\n**COXA:** «TIREM-ME DAQUI!»\n\nGancho fecha a mala, sem pressa e sem alterar a expressão.\n\n**CAPITÃO GANCHO:** «Preciso de ter audiências.»\n\nO Mercedes arranca e afasta-se pelo caminho. Os gritos de Coxa continuam a ouvir-se.\n\n**CORTE PARA PRETO.**\n\n**Prompt de imagem**\n> Create a polished 2D adult animated sitcom master frame of a black Mercedes parked at Monte do Coxa. The rear trunk is already open, and Coxa is already inside it, visibly trapped and shouting in frustration. Capitão Gancho stands calmly beside the car, impeccably composed. The open trunk and Coxa's position must be unmistakable. Use established canonical character and car references. Preserve exact identities and outfits. No extra characters, no readable text, no subtitles. 16:9.\n\n**Prompt de animação**\n> Start with Coxa already inside the open trunk of the black Mercedes, shouting loudly in European Portuguese (PT-PT): “TIREM-ME DAQUI!” Do not show how he got there. Capitão Gancho calmly closes the trunk and says, without raising his voice or changing expression: “Preciso de ter audiências.” The Mercedes drives away along the rural estate road. Coxa's muffled shouting continues as the car recedes. Cut abruptly to black. No extra dialogue, no narration, no additional gag after the car leaves, no changes to character identity or vehicle design.\n\n**Reframes necessários**\n- **06A — Coxa na mala:** usar um recorte do plano-mestre se a expressão e o grito não forem legíveis; gerar uma nova imagem apenas se o recorte não funcionar.\n- **06B — Gancho:** reframe curto para «Preciso de ter audiências», apenas se necessário.\n- **06C — Partida:** plano geral do Mercedes a afastar-se, necessário para concluir visualmente a ação.\n\n**Prompt de animação da partida**\n> After Gancho closes the trunk and delivers his line, the Mercedes pulls away from the estate and recedes down the rural path. Coxa continues shouting from inside, increasingly muffled. Keep the camera fixed and let the car leave the frame. Cut to black. No further dialogue.\n\n---\n\n## CONTROLO DE CONTINUIDADE\n\n- Coxa começa sozinho no escritório do monte, a aproveitar as férias.\n- A única voz off é a narração doce e irónica da abertura.\n- Capitão Gancho só aparece na cena da chegada do Mercedes.\n- O caseiro só aparece na chegada e trata Gancho por «Doutor».\n- Coxa e Gancho tratam-se formalmente; falas em português europeu (PT-PT).\n- Gancho quer trazer Coxa de volta à TVI mais cedo, mantém a calma e toma pessoalmente a decisão final.\n- A ameaça de ir para a SIC é uma provocação de Coxa, não uma saída real da TVI.\n- As gags físicas são rápidas: galinhas, cavalo e queda no balde de milho.\n- Não mostrar como Coxa vai parar à mala.\n- A cena final começa com Coxa já dentro da mala, aos gritos: «TIREM-ME DAQUI!»\n- Última fala de Gancho: «Preciso de ter audiências.»\n- O Mercedes afasta-se; corte para preto.\n- Não acrescentar a Abelha Maia, narradores recorrentes ou falas não incluídas no guião.\n- Reframes apenas quando necessários; não criar planos decorativos.\n\n## NOTA DE PRODUÇÃO\n\nA duração é estimada e deve ser confirmada na montagem. Gerar os reframes a partir do master frame sempre que a composição e a resolução o permitam. Usar as referências canónicas de Coxa e Capitão Gancho; não inventar detalhes de aparência, roupa ou voz.\n"},{"number":4,"title":"O Casting dos Desesperados","status":"Ideia provisória · por desenvolver","path":"Temporadas/Temporada-1/episodio-04-o-casting-dos-desesperados.md","kind":"ficha","content":"# Episódio 4 — O Casting dos Desesperados\n\n## Ficha de produção\n\n- **Formato:** Sitcom animada narrativa\n- **Duração prevista:** Por definir depois de escrever o guião\n- **Estado do guião:** Ideia provisória; guião por escrever\n- **Personagens:** Por definir\n- **Cenários/localizações:** Sala de casting a confirmar; reutilizar cenário existente se adequado\n- **Estado do texto:** Ainda não existe guião completo\n- **Som e efeitos:** Por definir no guião\n- **Nota de produção:** Fechar conflito, escalada e desfecho antes de storyboard ou criação de assets.\n\n> A duração é uma estimativa de trabalho, não uma duração final medida. Atualizar após fechar o guião e aprovar a decupagem.\n\n\n**Estado:** ideia provisória; falta fechar uma premissa forte e escrever o guião.\n\n## Direção atual\nA história deverá satirizar os castings de reality shows e o desespero da produção por encontrar concorrentes. A sala de casting só deve ser criada como cenário-base reutilizável se não existir já um asset adequado.\n\n## Próximo passo\nDefinir o conflito central, a escalada cómica e o desfecho antes de produzir o cenário ou storyboard.\n\n---\n\n**Estado editorial no arquivo:** Ideia provisória · por desenvolver\n**Tipo de documento:** Ficha de desenvolvimento, ainda não é um guião completo\n","decoupageContent":null},{"number":5,"title":"A Roda Está Viciada","status":"Rascunho de história · por fechar","path":"Temporadas/Temporada-1/episodio-05-a-roda-esta-viciada.md","kind":"ficha","content":"# Episódio 5 — A Roda Está Viciada\n\n## Ficha de produção\n\n- **Formato:** Sitcom animada narrativa\n- **Duração prevista:** Estimativa inicial: 1–2 minutos; confirmar após escrita\n- **Estado do guião:** Rascunho de história; guião por fechar\n- **Personagens:** Capitão Gancho, Tininha, Teresa Guilhermina I de Portugal\n- **Cenários/localizações:** Espaço de trabalho do Capitão/Tininha (por confirmar), escritório secreto de Teresa\n- **Estado do texto:** Premissa e diálogo-base existentes; ainda não é guião integral\n- **Som e efeitos:** Sons de escritório e chamada telefónica; restantes efeitos por definir\n- **Nota de produção:** A transferência deve sugerir manipulação das audiências sem explicar prematur
