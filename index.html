ustão da equipa, sem transformar o episódio numa sequência de piadas soltas.\n\n> A duração é uma estimativa de trabalho, não uma duração final medida. Atualizar após fechar o guião e aprovar a decupagem.\n\n\n**Estado:** rascunho de história; falta fechar o guião.\n\n## Premissa\nA equipa está exausta porque Capitão Gancho marca edições de reality show consecutivas. A edição anterior acabou ontem e a próxima começa amanhã. O estagiário está de rastos e tenta perceber quando poderá descansar.\n\n## Diálogo-base\n- PRODUTORA: “Mas a última edição acabou ontem!”\n- CAPITÃO GANCHO: “E amanhã começa outra.”\n- PRODUTOR: “Amanhã?!”\n- ESTAGIÁRIO: “Amanhã já é depois de hoje?”\n- CAPITÃO GANCHO: “Gosto de ver que ainda está atento.”\n\n## Próximo passo\nFechar a escalada cómica sem transformar a equipa numa sucessão de piadas soltas.\n\n---\n\n**Estado editorial no arquivo:** Rascunho de história · por fechar\n**Tipo de documento:** Ficha de desenvolvimento, ainda não é um guião completo\n","decoupageContent":null},{"number":7,"title":"A Espia","status":"Conceito provisório · por desenvolver","path":"Temporadas/Temporada-1/episodio-07-a-espia.md","kind":"ficha","content":"# Episódio 7 — A Espia\n\n## Ficha de produção\n\n- **Formato:** Sitcom animada narrativa com intriga\n- **Duração prevista:** Por definir depois de escrever o guião\n- **Estado do guião:** Conceito provisório; guião por escrever\n- **Personagens:** Teresa Guilhermina I de Portugal; restantes personagens por definir\n- **Cenários/localizações:** Escritório secreto de Teresa; outros locais por definir\n- **Estado do texto:** Ainda não existe guião completo\n- **Som e efeitos:** Por definir no guião\n- **Nota de produção:** Definir alvo, mecanismo da espionagem, conflito e desfecho antes de criar planos.\n\n> A duração é uma estimativa de trabalho, não uma duração final medida. Atualizar após fechar o guião e aprovar a decupagem.\n\n\n**Estado:** conceito provisório; ainda sem guião fechado.\n\n## Direção atual\nA história deverá aproveitar Teresa e o seu escritório secreto, com intriga e observação dos movimentos da estação. O mecanismo da espionagem, o alvo e o desfecho ainda precisam de ser definidos.\n\n## Próximo passo\nFechar a premissa e o conflito antes de criar planos ou assets específicos.\n\n---\n\n**Estado editorial no arquivo:** Conceito provisório · por desenvolver\n**Tipo de documento:** Ficha de desenvolvimento, ainda não é um guião completo\n","decoupageContent":null},{"number":8,"title":"O Barco da TVI","status":"Rascunho de história · por fechar","path":"Temporadas/Temporada-1/episodio-08-o-barco-da-tvi.md","kind":"ficha","content":"# Episódio 8 — O Barco da TVI\n\n## Ficha de produção\n\n- **Formato:** Sitcom animada narrativa; comédia de escalada visual\n- **Duração prevista:** Estimativa inicial: 2–3 minutos; confirmar após escrita\n- **Estado do guião:** Rascunho de história; guião por fechar\n- **Personagens:** Mário Galático, Capitão Gancho; restantes personagens por definir\n- **Cenários/localizações:** Tejo junto à Ponte 25 de Abril, barco da Dourito Blue, zona de produção por definir\n- **Estado do texto:** Premissa e diálogo-base existentes; ainda não é guião integral\n- **Som e efeitos:** Buzina marítima, ruídos do barco e sinais de alarme a definir na decupagem\n- **Nota de produção:** A marca escreve-se sempre Dourito Blue. Confirmar a sequência do barco a afundar no guião completo.\n\n> A duração é uma estimativa de trabalho, não uma duração final medida. Atualizar após fechar o guião e aprovar a decupagem.\n\n\n**Estado:** rascunho de história; falta fechar o guião.\n\n## Premissa\nMário Galático apresenta uma edição de reality show a bordo de um barco no Tejo, perto da Ponte 25 de Abril. A situação começa a correr mal quando o barco começa a afundar. A sátira centra-se na repetição interminável de formatos e edições especiais.\n\n## Diálogo-base\n- CAPITÃO GANCHO: “Mas isso não é o mesmo Big Brother de há três semanas?!”\n- MÁRIO GALÁTICO: “Não! Este é o Desafio Final All Stars Inverno Especial.”\n- MÁRIO GALÁTICO: “Os mesmos concorrentes, os mesmos segredos, as mesmas discussões… mas a casa tem uma máquina de café nova!”\n\n## Continuidade\nO nome da empresa de Mário é sempre **Dourito Blue**. As imagens do barco a afundar e outras revelações específicas ficam para depois da aprovação do guião.\n\n---\n\n**Estado editorial no arquivo:** Rascunho de história · por fechar\n**Tipo de documento:** Ficha de desenvolvimento, ainda não é um guião completo\n","decoupageContent":null},{"number":9,"title":"O Lançamento Naval","status":"Primeira versão, por aprovar","path":"Temporadas/Temporada-1/episodio-09-o-lancamento-naval.md","kind":"guião","content":"# OS LESADOS — Temporada 1, Episódio 9\n\n## Ficha de produção\n\n- **Formato:** Sitcom animada narrativa; sátira à repetição de formatos e edições especiais\n- **Duração prevista:** 3–4 minutos (duração-alvo existente)\n- **Estado do guião:** Primeira versão do guião; por aprovar\n- **Personagens:** Mário Galático, Capitão Gancho, Tininha, produtor de continuidade, assistente(s)\n- **Cenários/localizações:** Exterior da TVI, corredor de bastidores, gabinete do Capitão, estúdio principal, entrada de serviço vista no monitor\n- **Estado do texto:** Guião completo em primeira versão; falta aprovação narrativa\n- **Som e efeitos:** Buzina marítima, ruído de bastidores, luzes do estúdio, impacto da maquete, buzina final\n- **Nota de produção:** Reutilizar a abertura/transição exterior TVI existente. Não gerar grafismos com texto aleatório. A marca escreve-se sempre Dourito Blue.\n\n> A duração é uma estimativa de trabalho, não uma duração final medida. Atualizar após fechar o guião e aprovar a decupagem.\n\n# O Lançamento Naval\n\n**Estado:** primeira versão do guião, por aprovar  \n**Duração-alvo:** 3–4 minutos  \n**Personagens:** Mário Galático, Capitão Gancho, Tininha, produtor de continuidade  \n**Marca ficcional:** Dourito Blue\n\n## CENA 1 — EXTERIOR TVI — MANHÃ\n\n**PLANO DE ABERTURA:** plano aéreo do edifício da TVI. A câmara aproxima-se lentamente da torre e da fachada. Continuar o movimento com o background existente de transição exterior TVI e cortar para o corredor de bastidores.\n\nAo longe, ouve-se uma buzina marítima.\n\n## CENA 2 — CORREDOR DE BASTIDORES\n\nFuncionários passam apressados. Um deles pára, com o café a meio caminho da boca. A buzina ouve-se outra vez, agora mais perto.\n\nAs portas abrem-se. MÁRIO GALÁTICO entra de braços abertos. Dois assistentes transportam uma enorme maquete de um navio, com luzes de apresentação e um pequeno palco na proa.\n\n**MÁRIO GALÁTICO:** Meus senhores! Preparem-se para o maior lançamento naval da história da televisão!\n\nUm assistente bate com a maquete na ombreira da porta.\n\n**MÁRIO GALÁTICO:** Cuidado! Aquilo vale mais do que este corredor!\n\n**PRODUTOR DE CONTINUIDADE:** O senhor tem autorização para estar aqui?\n\n**MÁRIO GALÁTICO:** Autorização? Eu trouxe a embarcação. A autorização vem a bordo!\n\nA maquete atravessa o enquadramento e tapa a câmara.\n\n## CENA 3 — GABINETE DO CAPITÃO GANCHO\n\nA maquete sai do enquadramento e revela o gabinete do Capitão. O Capitão está a analisar a grelha de programação. Mário entra sem bater.\n\n**MÁRIO GALÁTICO:** Capitão! Preciso do estúdio principal. Tenho uma apresentação histórica.\n\n**CAPITÃO GANCHO:** De quê?\n\n**MÁRIO GALÁTICO:** Dos meus novos navios.\n\nPausa.\n\n**CAPITÃO GANCHO:** Isso faz-se num porto.\n\n**MÁRIO GALÁTICO:** Exatamente! E a televisão é o porto de todas as grandes ideias.\n\nO Capitão pousa a caneta.\n\n**CAPITÃO GANCHO:** O estúdio está ocupado.\n\n**MÁRIO GALÁTICO:** Ótimo. Já temos público.\n\n**CAPITÃO GANCHO:** Está ocupado com um programa.\n\n**MÁRIO GALÁTICO:** Melhor. Fazemos uma parceria.\n\n**CAPITÃO GANCHO:** Não.\n\n**MÁRIO GALÁTICO:** Uma parceria editorial.\n\n**CAPITÃO GANCHO:** Não.\n\n**MÁRIO GALÁTICO:** Uma parceria editorial com naming rights.\n\nO Capitão fecha lentamente a pasta.\n\n**CAPITÃO GANCHO:** Quanto tempo?\n\n**MÁRIO GALÁTICO:** Dez minutos.\n\n**CAPITÃO GANCHO:** Tem cinco.\n\n**MÁRIO GALÁTICO:** Perfeito. Os primeiros cinco são a apresentação. Os outros cinco são a experiência imersiva.\n\nO produtor começa a sair discretamente.\n\n**CAPITÃO GANCHO:** Volte aqui.\n\nO produtor pára.\n\n**CAPITÃO GANCHO:** Ainda não lhe expliquei o orçamento.\n\n## CENA 4 — ESTÚDIO PRINCIPAL\n\nAs luzes do estúdio acendem-se uma a uma. Tininha observa a equipa a afastar elementos do cenário para abrir espaço à apresentação. O Capitão tenta manter a situação sob controlo.\n\nMário sobe ao palco. No ecrã há imagens promocionais dos navios da Dourito Blue; os grafismos finais devem ser aplicados com assets aprovados, não gerados como texto aleatório.\n\n**MÁRIO GALÁTICO:** Apresento-vos o futuro da navegação! O Dourito Blue Premium, o Dourito Blue All Stars e a nossa grande inovação: o Dourito Blue Desafio Final Especial de Inverno!\n\nO Capitão fecha os olhos por um instante.\n\n**TININHA:** Temos um navio com nome de grelha de programação?\n\n**CAPITÃO GANCHO:** Temos um homem com acesso ao estúdio.\n\nMário aponta para a primeira maquete.\n\n**MÁRIO GALÁTICO:** O Premium tem restaurantes temáticos, suites de luxo e um sistema de entretenimento revolucionário!\n\n**TININHA:** Finalmente, algo normal.\n\n**MÁRIO GALÁTICO:** Cada passageiro recebe uma nomeação semanal!\n\nTininha deixa de sorrir.\n\n**MÁRIO GALÁTICO:** E no último dia, o menos popular abandona o navio!\n\nPausa.\n\n**CAPITÃO GANCHO:** Isso chama-se enjoo marítimo.\n\n**MÁRIO GALÁTICO:** Não, Capitão. Isso chama-se envolvimento do passageiro.\n\nMário aponta para o segundo navio.\n\n**MÁRIO GALÁTICO:** O All Stars traz de volta os melhores passageiros das edições anteriores!\n\n**TININHA:** Os passageiros?\n\n**MÁRIO GALÁTICO:** Os mesmos quartos, as mesmas mesas, as mesmas discussões. Mas desta vez temos uma piscina nova!\n\n**CAPITÃO GANCHO:** Isso não é um navio. É uma repetição com água.\n\nMário fica emocionado.\n\n**MÁRIO GALÁTICO:** Vou usar essa frase na campanha.\n\n## CENA 5 — A REVELAÇÃO\n\nUm assistente aproxima-se do Capitão e sussurra-lhe.\n\n**ASSISTENTE:** Doutor... há um pequeno problema.\n\n**CAPITÃO GANCHO:** Qual?\n\n**ASSISTENTE:** O senhor Mário não trouxe só as maquetes.\n\nO Capitão olha para o monitor do estúdio. Surge uma imagem em direto da entrada de serviço da TVI. Um navio gigantesco da Dourito Blue está estacionado do lado de fora, demasiado grande para o espaço.\n\nSilêncio.\n\n**CAPITÃO GANCHO:** Isso é uma imagem.\n\n**ASSISTENTE:** Sim, Doutor.\n\n**CAPITÃO GANCHO:** Ainda bem.\n\n**ASSISTENTE:** É em direto.\n\nO Capitão aproxima-se do monitor. Pela janela do estúdio, uma sombra gigantesca cobre a luz. Os adereços tremem ligeiramente com o som de uma buzina.\n\n**TININHA:** Isto estava previsto na produção?\n\n**CAPITÃO GANCHO:** Não.\n\n**TININHA:** Então quem autorizou?\n\nO Capitão olha para Mário.\n\n**MÁRIO GALÁTICO:** Ninguém. Quis surpreender-vos!\n\nA buzina soa novamente. A luz vermelha de uma câmara acende-se.\n\n**MÁRIO GALÁTICO:** Já estamos em direto!\n\n## CENA 6 — FECHO\n\nO Capitão respira fundo, endireita a gravata e aproxima-se da câmara.\n\n**CAPITÃO GANCHO:** Boa tarde. Por motivos técnicos, a apresentação de hoje será ligeiramente diferente do previsto.\n\nAo fundo, Mário sobe à maquete e acena como se estivesse na proa de um navio verdadeiro.\n\n**MÁRIO GALÁTICO:** BEM-VINDOS A BORDO!\n\nO Capitão olha para a câmara. Uma buzina marítima faz tremer o estúdio.\n\n**CAPITÃO GANCHO:** Amanhã, vamos fazer um programa sobre seguros.\n\n**CORTE PARA PRETO.**\n\nOuve-se uma última buzina.\n\n**FIM.**\n\n## Notas de realização\n\n- Usar a abertura aérea da TVI já existente e a transição exterior; não gerar versões novas desses assets.\n- Fazer transições motivadas pela ação: maquete a tapar a lente, luzes do estúdio a acender e corte do monitor para o navio no exterior.\n- O navio gigante fica do lado de fora, na entrada de serviço. Não o mostrar a navegar literalmente por corredores interiores.\n- Mário é expansivo e genuinamente convencido de que cada ideia é genial. Capitão mantém frases curtas, voz baixa e autoridade prática; nunca grita.\n- Tininha mantém a compostura pública e a superioridade institucional.\n- A marca escreve-se sempre **Dourito Blue**.\n- O guião ainda não está aprovado. Não gerar storyboard final, imagens ou vídeo antes da aprovação do guião e da seleção dos masters.\n\n\n---\n\n**Estado editorial no arquivo:** Primeira versão, por aprovar\n**Tipo de documento:** Guião / história escrita\n","decoupageContent":null},{"number":10,"title":"A Sucessora Oficial","status":"Decupagem completa para produção","path":"Temporadas/Temporada-1/episodio-10-a-sucessora-oficial.md","kind":"guião","decoupagePath":"docs/episodios/T1E10-a-sucessora-oficial-decupagem.md","decoupageStatus":"Completa","content":"# Episódio 10 — A Sucessora Oficial\n\n## Ficha de produção\n\n- **Formato:** sitcom animada narrativa\n- **Duração-alvo:** 60–90 segundos\n- **Estado:** guião consolidado para produção\n- **Personagens:** Tininha, Teresa, Capitão Gancho, realizador, produtor e operador(es) da régie\n- **Locais:** palco de Secret Story, régie de emissão, gabinete do Capitão Gancho, sala de reuniões da produção e sala secreta de Teresa\n\n## Premissa\n\nDurante a apresentação da nova edição de Secret Story, Tininha é humilhada por legendas inesperadas que aparecem no ecrã gigante. A produção entra em pânico, Tininha ameaça despedir toda a equipa e o realizador interrompe a emissão com um mini break. No final, descobrimos que Teresa está por trás da sabotagem: observa Tininha numa sala secreta, com os olhos vermelhos, e ri-se de forma maléfica.\n\n## Cena 1 — Palco de Secret Story — Dia\n\nTininha apresenta a nova edição no centro do palco, confiante e sorridente. O ecrã gigante mostra a identidade visual do programa.\n\n**TININHA:** «Esta será uma edição como nunca viu. Uma nova casa, novos segredos e…»\n\nSurge inesperadamente uma legenda no ecrã:\n\n**«TININHA — A SUCESSORA DA TERESA GUILHERMINA I DE PORTUGAL»**\n\nTininha congela por um instante. O sorriso fica preso.\n\n**TININHA (entre dentes):** «Tirem isso. Tirem isso imediatamente.»\n\n## Cena 2 — Régie de emissão — Dia\n\nA produção acompanha a emissão através dos monitores.\n\n**PRODUTOR 1:** «O que é isto?! O que é isto?!»\n\n**REALIZADOR:** «Quem é que pôs essa legenda no ar?!»\n\n**OPERADOR:** «Não fui eu! Eu nem estou a mexer nos grafismos!»\n\nA primeira legenda desaparece. A equipa suspira de alívio.\n\nSurge imediatamente uma segunda legenda:\n\n**«SUCESSORA EM AVALIAÇÃO»**\n\nSilêncio absoluto.\n\n**PRODUTOR 1:** «Ai, estamos tramados.»\n\nA voz de Tininha chega à régie através do sistema de comunicação da produção.\n\n**TININHA (O.S.):** «RESOLVAM ISSO JÁ! SE NÃO RESOLVEREM ISTO, VÃO TODOS PARA A RUA!»\n\nA equipa entra em pânico.\n\n**OPERADOR:** «Todos… todos mesmo?»\n\n**REALIZADOR:** «AGORA NÃO!»\n\nSurge uma terceira legenda:\n\n**«RESULTADO DA AVALIAÇÃO: AINDA NÃO CONVENCE.»**\n\nO realizador levanta-se tão depressa que derruba a cadeira.\n\n**REALIZADOR:** «DESLIGUEM O ECRÃ! DESLIGUEM TUDO!»\n\nO ecrã fica preto.\n\n## Cena 3 — Gabinete do Capitão Gancho e régie — Dia\n\nO Capitão observa o incidente num monitor. Está sozinho e mantém a expressão completamente impassível.\n\n**CAPITÃO GANCHO:** «Interessante.»\n\nFica a olhar para o ecrã durante mais um instante. Não sabemos se está impressionado, irritado ou simplesmente entretido.\n\n### Sala de reuniões\n\nCorte para uma sala de reuniões onde vários elementos da produção estão em pânico. Um anda de um lado para o outro; outra pessoa tem as mãos na cabeça; um terceiro começa a guardar discretamente os seus pertences numa caixa.\n\n**PRODUTOR 1:** «Meu Deus, vamos ser todos despedidos!»\n\n**PRODUTORA 2:** «Eu tenho dois filhos!»\n\n**PRODUTOR 3:** «Eu nem sequer trabalho nos grafismos!»\n\nO realizador entra na sala, desesperado.\n\n**REALIZADOR:** «Alguém sabe quem fez aquilo?!»\n\nTodos apontam uns para os outros.\n\n**OPERADOR:** «Eu avisei que não devíamos ter mudado o sistema!»\n\n**PRODUTORA 2:** «Você disse que o sistema era novo!»\n\n**OPERADOR:** «E é! Novo e já me arruinou a vida!»\n\nUm produtor pega na caneca e dirige-se lentamente à porta.\n\n**PRODUTOR 1:** «Vou começar a despedir-me das pessoas enquanto ainda posso.»\n\nTodos começam a falar ao mesmo tempo.\n\n**REALIZADOR:** «CALMA! Ninguém vai ser despedido se resolvermos isto!»\n\nSilêncio.\n\n**PRODUTOR 3:** «E se não resolvermos?»\n\nO realizador olha para ele, sem resposta, e sai disparado.\n\n### Regresso à régie\n\nO realizador continua a tentar resolver o problema. Um operador mexe freneticamente nos controlos, enquanto outro aponta para os monitores.\n\n**REALIZADOR:** «DESLIGUEM O ECRÃ! DESLIGUEM TUDO!»\n\nO ecrã permanece preto.\n\nO realizador olha para a equipa, completamente desesperado.\n\n**REALIZADOR:** «Vamos para mini break!»\n\nA emissão corta abruptamente para um separador de mini break, com música alegre em contraste com o caos da situação.\n\n## Cena 4 — Sala secreta de Teresa — Noite\n\nTeresa está sentada diante de um monitor que mostra Tininha furiosa no palco, nos instantes anteriores ao mini break.\n\nTeresa observa a imagem em silêncio. Os olhos começam lentamente a ficar vermelhos. Um sorriso maléfico forma-se no rosto.\n\n**TERESA:** «Sucessora em avaliação…»\n\nComeça a rir-se de forma diabólica e progressivamente exagerada.\n\n**TERESA:** «Ah! Ah! Ah! Ah!»\n\nInclina-se para trás, satisfeita.\n\n**CORTE PARA PRETO.**\n\n## Regras de continuidade\n\n- Todas as falas são em português europeu (PT-PT).\n- Preservar os designs, a roupa e as proporções oficiais das personagens.\n- A apresentação decorre no mesmo palco, com Tininha no centro e o ecrã gigante atrás dela.\n- As três legendas aparecem pela ordem exata do guião. Se a ferramenta não gerar texto corretamente, acrescentá-las na pós-produção.\n- A régie é uma sala de trabalho normal que se transforma em caos devido ao incidente; não criar um cenário de emergência separado.\n- A sala de reuniões mostra o pânico da equipa depois da reação calma do Capitão; a comédia vem das ações simultâneas e da conversa acelerada.\n- O Capitão está sozinho no gabinete quando diz «Interessante». A régie não ouve a fala nem reage a ela.\n- O mini break é uma decisão desesperada do realizador para interromper a emissão.\n- A sala secreta só aparece na cena final. Não explicar como Teresa sabotou os grafismos.\n- Não incluir voz off, Abelha Maia ou cenas depois do corte para preto.\n- Manter o ritmo rápido, com pausas cómicas breves e duração total de 60–90 segundos.\n","decoupageContent":"<!-- OS_LESADOS_DECOUPAGE_STATUS: COMPLETE -->\n# OS LESADOS\n## Temporada 1 · Episódio 10 — A Sucessora Oficial\n### Guião técnico e decupagem de produção\n\n**Estado:** consolidada para produção  \n**Idioma:** português europeu (PT-PT)  \n**Estilo:** sitcom de animação 2D  \n**Duração-alvo:** 60–90 segundos; durações por plano indicativas, ajustadas à interpretação e montagem.\n\n## Regras de realização obrigatórias\n\n1. Reutilizar as referências aprovadas de personagens e cenários de OS LESADOS. Não redesenhar personagens nem alterar a linguagem visual.\n2. Criar master frames apenas para os espaços necessários: palco de Secret Story, régie, sala de reuniões da produção e sala secreta de Teresa. Reutilizar o gabinete do Capitão se já existir uma referência aprovada.\n3. Os master frames estabelecem a geografia, a composição e a posição das personagens. Os reframes devem partir desses enquadramentos e existir apenas quando reforçam a piada ou a reação.\n4. Não criar um plano novo para cada fala nem usar shot/reverse-shot automático. Priorizar planos de grupo e reações pontuais.\n5. Preservar posições, direção dos olhares, iluminação, mobiliário, roupa e desenho das personagens.\n6. Todas as falas são em português europeu (PT-PT). Os prompts de imagem e animação são em inglês.\n7. As legendas de emissão devem aparecer exatamente como especificadas. Se a geração de texto não for fiável, aplicá-las na pós-produção.\n8. O Capitão está sozinho no gabinete quando diz «Interessante». A régie não ouve essa fala e não reage a ela.\n9. A sabotagem não é explicada. A sala secreta e a gargalhada de Teresa só surgem no final.\n10. Manter o episódio entre 60 e 90 segundos, com ritmo rápido e pausas cómicas breves.\n\n---\n\n# CENA 1 — INT. PALCO DE SECRET STORY — DIA\n\n**Objetivo:** apresentar Tininha confiante e quebrar a sua pose com uma legenda humilhante.\n\n## PLANO 01 — A apresentação é interrompida\n\n**01A · MASTER FRAME DO PALCO**  \n**Duração estimada:** 5–6 s  \n**Câmara:** plano geral frontal do palco, Tininha ao centro e ecrã gigante atrás  \n**Personagens:** Tininha\n\n**Prompt de imagem**\n> Use the approved OS LESADOS character reference for Tininha and the approved Secret Story studio background. Place Tininha at the centre of the stage, confidently presenting the new edition directly to the main camera. Preserve her exact character design, hairstyle, clothing, proportions, the established stage layout, lighting and 2D linework. The large LED screen behind her contains the show's existing visual identity but no newly invented logos. Clean 2D sitcom animation, wide 16:9 composition.\n\n**Prompt de animação**\n> Tininha presents the new edition with a polished television-host smile and confident posture. Keep the camera in a stable wide master shot as she begins her sentence in European Portuguese. No additional characters enter and no unnecessary camera movement.\n\n**TININHA:** «Esta será uma edição como nunca viu. Uma nova casa, novos segredos e…»\n\n**01B · REFRAME — A LEGENDA INESPERADA**  \n**Duração estimada:** 4–5 s  \n**Câmara:** plano médio de Tininha, com parte do ecrã ainda visível  \n**Personagens:** Tininha\n\n**Prompt de imagem**\n> Reframe from the approved Secret Story stage master. Medium shot of Tininha centred in the composition, still presenting, with the large LED screen visible behind her. Preserve the exact approved character design, outfit, studio lighting and background. Leave clear space on the screen for a broadcast lower-third to be added in post-production. 2D sitcom animation, 16:9.\n\n**Prompt de animação**\n> A humiliating lower-third suddenly appears on the LED screen behind Tininha. Her smile freezes; she pauses for a beat, then speaks through clenched teeth without fully turning away from the main camera. Keep the movement restrained and the reaction readable.\n\n**LEGENDA 1:** «TININHA — A SUCESSORA DA TERESA GUILHERMINA I DE PORTUGAL»\n\n**TININHA (entre dentes):** «Tirem isso. Tirem isso imediatamente.»\n\n**Transição:** corte direto para a régie.\n\n---\n\n# CENA 2 — INT. RÉGIE DE EMISSÃO — DIA\n\n**Objetivo:** transformar uma sabotagem simples num desastre televisivo e mostrar a produção a perder o controlo.\n\n## PLANO 02 — A produção tenta perceber o que aconteceu\n\n**02A · MASTER FRAME DA RÉGIE**  \n**Duração estimada:** 5–6 s  \n**Câmara:** plano geral da régie, parede de monitores à frente e consola em primeiro plano  \n**Personagens:** produtor 1, realizador e operador\n\n**Prompt de imagem**\n> Create the approved OS LESADOS 2D sitcom control room as a coherent wide master frame: a front wall of broadcast monitors with abstract non-readable screen content, technical console and operator chairs. Include the production team in the established character style: a producer, a director wearing a headset and an operator at the controls. The monitors show the Secret Story stage feed. No legible text yet, no invented logos, no photorealism, no 3D. Clear 16:9 composition suitable for later reframing.\n\n**Prompt de animação**\n> The production team notices the unexpected graphic on the stage feed. The producer leans forward in disbelief, the director looks between the monitors and the operator, and the operator raises both hands defensively. Deliver the lines quickly, with overlapping urgency but clear lip-sync in European Portuguese. Keep the wide composition.\n\n**PRODUTOR 1:** «O que é isto?! O que é isto?!»\n\n**REALIZADOR:** «Quem é que pôs essa legenda no ar?!»\n\n**OPERADOR:** «Não fui eu! Eu nem estou a mexer nos grafismos!»\n\n**02B · REFRAME — A SEGUNDA LEGENDA**  \n**Duração estimada:** 4–5 s  \n**Câmara:** plano mais fechado sobre os monitores, com parte das reações da equipa visível  \n**Personagens:** produtor 1 e operador, parcialmente visíveis\n\n**Prompt de imagem**\n> Reframe of the same approved control room, focusing on the monitor wall and the production team's partial reactions. Keep the same monitor layout, console, lighting and 2D linework. Leave the relevant screen area clear for a lower-third graphic added in post-production. No new characters or set changes.\n\n**Prompt de animação**\n> The first lower-third disappears. The production team briefly relaxes. Immediately, a second lower-third appears on the monitor. Hold for a short, uncomfortable beat as everyone freezes. The producer slowly turns towards the screen and delivers the line.\n\nA primeira legenda desaparece. A equipa suspira de alívio.\n\n**LEGENDA 2:** «SUCESSORA EM AVALIAÇÃO»\n\nSilêncio absoluto.\n\n**PRODUTOR 1:** «Ai, estamos tramados.»\n\n**02C · REFRAME — A AMEAÇA DE TININHA**  \n**Duração estimada:** 5–6 s  \n**Câmara:** plano médio do realizador e operador, monitores visíveis ao fundo  \n**Personagens:** realizador, operador e produtor 1\n\n**Prompt de imagem**\n> Medium shot within the exact same OS LESADOS control room. The director and operator are framed at the technical console, with the producer visible nearby and the monitor wall behind them. Preserve the established 2D character designs, room layout, lighting and palette. The stage feed remains visible on one monitor.\n\n**Prompt de animação**\n> Tininha's furious voice comes through the production communication system. The team reacts as if their jobs are at risk: the operator stiffens, the producer looks alarmed, and the director gestures urgently at the screens. The operator raises a hand and asks a nervous question; the director snaps back without looking at him. Comedic timing, restrained physical movement, clear European Portuguese lip-sync.\n\n**TININHA (O.S.):** «RESOLVAM ISSO JÁ! SE NÃO RESOLVEREM ISTO, VÃO TODOS PARA A RUA!»\n\n**OPERADOR:** «Todos… todos mesmo?»\n\n**REALIZADOR:** «AGORA NÃO!»\n\n**02D · REFRAME — O GOLPE FINAL**  \n**Duração estimada:** 5–6 s  \n**Câmara:** plano de reação do realizador, incluindo monitor no enquadramento  \n**Personagens:** realizador e equipa ao fundo\n\n**Prompt de imagem**\n> Reframe within the same control room, favouring the director at the console while keeping the monitor showing the stage feed clearly visible. The director is visibly close to losing his composure. Maintain exact room continuity, established character designs and the approved 2D sitcom style. Reserve clear space on the monitor for the final lower-third.\n\n**Prompt de animação**\n> A third humiliating lower-third appears. The director jumps up so abruptly that his chair falls backwards. He shouts for the screen to be switched off. The monitor turns black. The team reacts in panic. Make the chair fall and the screen going black clearly readable, without adding extra gags or characters.\n\n**LEGENDA 3:** «RESULTADO DA AVALIAÇÃO: AINDA NÃO CONVENCE.»\n\n**REALIZADOR:** «DESLIGUEM O ECRÃ! DESLIGUEM TUDO!»\n\nO ecrã fica preto.\n\n**Transição:** corte para o gabinete do Capitão.\n\n---\n\n# CENA 3 — INT. GABINETE DO CAPITÃO GANCHO / RÉGIE — DIA\n\n**Objetivo:** contrastar a calma do Capitão com o desespero da produção e terminar a emissão com um mini break.\n\n## PLANO 03 — O Capitão observa\n\n**03A · MASTER FRAME EXISTENTE DO GABINETE**  \n**Duração estimada:** 4–5 s  \n**Câmara:** usar o master angle aprovado do gabinete; o Capitão está sozinho  \n**Personagens:** Capitão Gancho\n\n**Prompt de imagem**\n> Use the existing approved master-angle reference of Captain Hook's office. Preserve the exact room layout, desk, chair, monitor, lighting, furniture and 2D animation style. Captain Hook is alone in the room, seated and calmly watching the incident on a monitor. No other characters are present.\n\n**Prompt de animação**\n> Captain Hook watches the monitor in silence, completely composed. After a brief pause, he says “Interessante.” in a calm, dry tone, with minimal facial movement. He is alone. Do not cut to the control room during this line and do not show anyone hearing or reacting to it.\n\n**CAPITÃO GANCHO:** «Interessante.»\n\nO Capitão continua a olhar para o monitor, sem revelar o que pensa.\n\n**03B · MASTER FRAME — O PÂNICO NA SALA DE REUNIÕES**  \n**Duração estimada:** 8–10 s  \n**Câmara:** plano geral de grupo, mesa de reuniões ao centro e porta visível  \n**Personagens:** produtor 1, produtora 2, produtor 3, realizador e operador\n\n**Prompt de imagem**\n> Create a new meeting room for the OS LESADOS 2D sitcom, consistent with the existing production-office visual language. Wide group composition with a meeting table, several chairs and a clearly visible door. Three production staff members are already panicking: one pacing back and forth, one holding her head, and another discreetly putting personal items into a cardboard box. Leave enough space for the director to enter. Preserve the established character design language, clean 2D linework and 16:9 composition. No readable text, no logos, no photorealism, no 3D.\n\n**Prompt de animação**\n> Cut from Captain Hook's calm office to a chaotic meeting room. One producer paces back and forth, a female producer holds her head, and another staff member starts packing personal items into a cardboard box. Deliver the dialogue as a fast, escalating group scene in European Portuguese (PT-PT). When the director asks who cau     function audit(ep) {
      const issues = [];
      const banned = ["goucha", "moniz", "cristina ferreira", "teresa guilherme"];
      const text = [ep.name, ep.premise, ...ep.scenes.flatMap(s => [s.location, s.action, s.reversal || "", s.prompt || "", s.dialogue?.line || ""])].join(" ").toLowerCase();
      banned.forEach(b => { if (text.includes(b)) issues.push({ type:"critical", msg:`Nome real proibido detetado: ${b}.` }); });
      ep.scenes.forEach(s => {
        if (Number(s.duration) > 8) issues.push({ type:"error", msg:`Take ${s.id} excede 8 segundos.` });
        if (s.alertMel && !/ALERTA MEL/.test(s.prompt || "")) issues.push({ type:"critical", msg:`Take ${s.id} tem Abelha Maia sem ALERTA MEL no prompt.` });
        if (s.reframeOf) {
          const ref = ep.scenes.find(x => x.id === s.reframeOf);
          if (!ref) issues.push({ type:"error", msg:`Take ${s.id} referencia reframe inexistente ${s.reframeOf}.` });
          else if (locBase(ref.location) !== locBase(s.location)) issues.push({ type:"error", msg:`Take ${s.id} é reframe mas mudou de localização.` });
        }
      });
      if (!issues.length) issues.push({ type:"success", msg:"Auditoria OK." });
      return issues;
    }

    }

    async function aiGenerateEpisode() {
      if (location.protocol === "file:") return status("Para gerar, abre via http://localhost:8787.", "error");
      const name = ($("episodeName").value || "").trim();
      const premise = ($("premise").value || "").trim();
      if (!name) return status("Escreve o nome do episódio.", "error");
      if (!premise) return status("Escreve uma premissa.", "error");
      const btn = $("aiGenerateBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> IA a escrever...';
      try {
        const cleanPremise = sanitize(premise), cleanName = sanitize(name);
        const stars = detectCast(cleanPremise);
        const castIds = (stars.length ? stars : ["coxa", "claudio"]).filter(id => charById[id]);
        const res = await fetch(`${backendUrl()}/story/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ premise: cleanPremise, castIds })
        });
        let data;
        try { data = await res.json(); }
        catch { throw new Error(`Resposta inválida do backend (HTTP ${res.status}).`); }
        if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
        if (!data.story) throw new Error("Backend não devolveu história.");
        if (!state.seasons.length) state.seasons.push({ id: "s1", name: "Season 1", episodes: [] });
        const season = state.seasons.find(s => s.id === state.currentSeason) || state.seasons[0];
        const number = (season.episodes.length || 0) + 1;
        const story = normalizeAIStory(data.story, cleanPremise, castIds);
        story.title = cleanName;
        const episode = {
          id: `e${season.id}-${number}-${Date.now()}`,
          number, name: cleanName, premise: cleanPremise,
          season: state.seasons.indexOf(season) + 1,
          schemaVersion: EPISODE_SCHEMA, storyVersion: 1,
          story, scenes: storyToScenes(story, 1),
          format: classifyFormat(cleanPremise, castIds),
          // Abelha ocasional: narração só quando ela está no elenco com
          // função narrativa. Sem VO automática, sem fórmula fixa.
          narration: (castIds || []).includes("abelha") ? buildNarration(cleanName) : null,
          tagScene: buildTagScene(castIds, cleanPremise),
          coldOpen: pickColdOpen(premise, number)
        };
        episode.runtime = estimateDuration(episode.scenes);
        episode.audit = [...auditStory(episode), ...audit(episode)];
        season.episodes.push(episode);
        state.currentSeason = season.id;
        state.currentEpisode = episode.id;
        state.currentScene = episode.scenes[0]?.id || null;
        save();
        renderAudit(episode.audit);
        renderScript();
        renderPipeline();
        renderHeaderNav();
        switchTab("script");
        $("episodeName").value = "";
        $("premise").value = "";
        status(`Episódio ${number} gerado por IA (${data.provider || "gemini-text"}, ${data.model || "?"}).`, "success");
      } catch (e) {
        status("IA indisponível: " + e.message + " Nenhum episódio foi criado.", "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "✨ Gerar episódio com IA";
      }
    }

      html += "<table class=\"vtable\"><tr><th>Take</th><th>Still aprovado</th><th>Prompt imagem aprovado</th><th>Animar em vídeo (OMNI FLASH)</th><th></th></tr>";
      const clips = buildVideoClips(list);
      const byId = Object.fromEntries(list.map(s => [s.id, s]));
      clips.forEach(c => {
        const takes = c.takes;
        const ids = takes.map(s => s.id).join(" → ");
        const totalDur = takes.reduce((a, s) => a + Number(s.duration || 0), 0);
        const mel = takes.some(s => s.alertMel);
        const pair = takes.length > 1;
        html += `<tr><td><strong style="color:var(--canon)">▶ ${esc(ids)}</strong><br><span class="meta">${totalDur}s · 16:9${mel ? " · MEL" : ""} · ${pair ? "🎬 INITIAL+FINAL" : (needsFinalFrame(takes[0]) ? "🎬 2 FRAMES" : "🎬 1 FRAME")}</span></td>`;
        html += `<td class="thumb">${takes.map(s => s.imageUrl ? `<img src="${esc(s.imageUrl)}" alt="take ${esc(s.id)}" style="margin-bottom:6px;">` : `<div class="meta" style="margin-bottom:6px;">${esc(s.id)} · still gerado fora da app<br>anexa-o como primeiro frame</div>`).join("")}</td>`;
        html += `<td>${takes.map(s => `<div class="vprompt" style="margin-bottom:6px;">${esc((s.prompt || "").slice(0, 400))}${(s.prompt || "").length > 400 ? "…" : ""}</div><div class="meta">${esc(s.id)} · ${esc(s.model || "sem modelo")} · v${s.variant || 0}</div>`).join("")}</td>`;
        html += `<td><div class="vnote">${esc(clipVideoNote(c, byId))}</div><div class="vprompt">${esc(clipVideoPrompt(c))}</div></td>`;
        const prevTake = list[list.indexOf(takes[0]) - 1];
        const canJoin = !c.chained && prevTake && String(prevTake.sceneId) === String(takes[0].sceneId);
        const joinTotal = canJoin ? Number(prevTake.duration || 0) + Number(takes[0].duration || 0) : 0;
        const joinBtn = c.chained
          ? `<button class="btn btn-sm" data-split="${esc(takes[takes.length - 1].id)}">Separar</button>`
          : canJoin
            ? `<button class="btn btn-sm" data-join="${esc(takes[0].id)}" ${joinTotal > JOIN_HARD_MAX ? "disabled" : ""} title="Animar ${esc(takes[0].id)} e ${esc(prevTake.id)} num só clip${joinTotal > JOIN_MAX_SECONDS ? " — acima dos 8s do take, encurta os planos se quiseres" : ""}">Juntar (${joinTotal}s${joinTotal > JOIN_MAX_SECONDS ? " ⚠️" : ""})</button>`
            : "";
        html += `<td><button class="btn btn-sm" data-copy="${esc(clipKey(c))}">Copiar</button>${joinBtn ? "<br>" + joinBtn : ""}</td></tr>`;
      });
      html += "</table>";
      $("videoContent").innerHTML = html;
      $("copyAllVideoBtn")?.addEventListener("click", copyAllVideoPrompts);
      $("videoContent").querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => copyVideoPrompt(b.dataset.copy)));
      $("videoContent").querySelectorAll("[data-join]").forEach(b => b.addEventListener("click", () => setVideoJoin(b.dataset.join, true)));
      $("videoContent").querySelectorAll("[data-split]").forEach(b => b.addEventListener("click", () => setVideoJoin(b.dataset.split, false)));
    }
    function copyVideoPrompt(key) {
      const { list } = approvedScenes();
      const c = buildVideoClips(list).find(x => clipKey(x) === key);
      if (!c) return status("Take não encontrado.", "error");
      const label = c.takes.map(s => s.id).join(" → ");
      navigator.clipboard.writeText(clipVideoPrompt(c)).then(() => status(`Prompt vídeo (${label}) copiado.`, "success"), () => status("Falha ao copiar.", "error"));
    }
    function copyAllVideoPrompts() {
      const { list } = approvedScenes();
      const clips = buildVideoClips(list);
      const byId = Object.fromEntries(list.map(s => [s.id, s]));
      const all = clips.map(c => {
        const label = c.takes.map(s => s.id).join(" → ");
        return `=== TAKES ${label} ===\n${clipVideoNote(c, byId)}\n\n${clipVideoPrompt(c)}`;
      }).join("\n\n");
      navigator.clipboard.writeText(all).then(() => status(`${clips.length} prompts copiados.`, "success"), () => status("Falha ao copiar.", "error"));
    }
    function updateVideoTab() {
      const { list } = approvedScenes();
      const clips = buildVideoClips(list).length;
      const tab = document.querySelector('[data-tab="video"]');
      if (tab) tab.textContent = `Video${clips ? ` (${clips})` : ""}`;
    }
    function activeTab() { const t = document.querySelector(".tab.active"); return (t && t.dataset.tab) || "script"; }
    function refreshAll() {
      renderHeaderNav();
      updateVideoTab();
      const t = activeTab();
      if (t === "script") renderScript();
      if (t === "pipeline") renderPipeline();
      if (t === "canon") renderCanon();
      if (t === "video") renderVideo();
    }
    function renderHeaderNav() {
      const nav = $("epNav");
      if (!state.seasons.length) {
        nav.innerHTML = '<span class="epnav-empty">Sem episódios — gera o primeiro na sidebar.</span>';
        return;
      }
      const sOpts = state.seasons.map(s => `<option value="${esc(s.id)}"${s.id === state.currentSeason ? " selected" : ""}>${esc(s.name)}</option>`).join("");
      const season = state.seasons.find(s => s.id === state.currentSeason) || state.seasons[0];
      const eOpts = season.episodes.map(e => {
        const ap = e.scenes.filter(s => s.approved).length;
        return `<option value="${esc(e.id)}"${e.id === state.currentEpisode ? " selected" : ""}>Ep. ${e.number}: ${esc(e.name)}${ap ? ` ✅${ap}` : ""}</option>`;
      }).join("");
      const total = state.seasons.reduce((a, s) => a + s.episodes.length, 0);
      const totalAp = state.seasons.reduce((a, s) => a + s.episodes.reduce((x, e) => x + e.scenes.filter(sc => sc.approved).length, 0), 0);
      nav.innerHTML = `<div class="epnav-group"><span class="epnav-kicker">Season</span><span class="epnav-select-wrap"><select id="seasonSel">${sOpts}</select></span></div><div class="epnav-divider"></div><div class="epnav-group"><span class="epnav-kicker">Episódio</span><span class="epnav-select-wrap"><select id="epSel">${eOpts}</select></span></div><div class="epnav-divider"></div><span class="epnav-meta">${total} ep${total === 1 ? "" : "s"} · ${totalAp} aprovados</span>`;
      $("seasonSel").addEventListener("change", ev => {
        const s = state.seasons.find(x => x.id === ev.target.value);
        if (!s) return;
        state.currentSeason = s.id;
        state.currentEpisode = s.episodes[0]?.id || null;
        state.currentScene = null;
        save();
        const ep = currentEpisode();
        if (ep) renderAudit(ep.audit);
        refreshAll();
      });
      $("epSel").addEventListener("change", ev => selectEpisode(ev.target.value));
    }
    function selectEpisode(epId) {
      state.currentEpisode = epId;
      state.currentScene = null;
      const ep = currentEpisode();
      save();
      if (ep) renderAudit(ep.audit);
      refreshAll();
    }
    function deleteEpisode(epId) {
      const season = state.seasons.find(s => s.id === state.currentSeason) || state.seasons[0];
      if (!season) return;
      const ep = season.episodes.find(e => e.id === epId);
      if (!ep) return;
      if (!confirm(`Apagar o episódio ${ep.number} "${ep.name}"?`)) return;
      season.episodes = season.episodes.filter(e => e.id !== epId);
      if (state.currentEpisode === epId) {
        state.currentEpisode = season.episodes[0]?.id || null;
        state.currentScene = null;
      }
      save();
      const cur = currentEpisode();
      if (cur) renderAudit(cur.audit);
      else $("audit").innerHTML = "";
      refreshAll();
      status(`Episódio ${ep.number} apagado.`, "success");
    }
    function backendUrl() { return ($("backendUrl").value || "/api").replace(/\/$/, ""); }
    function model() { return $("modelSelect").value || "gemini-nano-banana-2.1"; }
    function provider() { const el = $("providerSelect"); return (el && el.value) || "gemini"; }
    const providerModels = {
      gemini: [["gemini-nano-banana-2.1", "Nano Banana 2.1"], ["gemini-3-pro-image", "Nano Banana Pro"]],
      openai: [["gpt-image-1", "gpt-image-1 (recomendado)"], ["gpt-image-1-mini", "gpt-image-1-mini (rápido)"], ["gpt-image-1.5", "gpt-image-1.5"]],
      huggingface: [["stabilityai/stable-diffusion-xl-base-1.0", "SDXL base (default)"], ["stabilityai/stable-diffusion-2-1", "SD 2.1"]],
      cloudflare: [["@cf/black-forest-labs/flux-1-schnell", "FLUX schnell (rápido)"], ["@cf/stabilityai/stable-diffusion-xl-base-1.0", "SDXL base"]]
    };
    function syncModelOptions() {
      const sel = $("modelSelect");
      const list = providerModels[provider()] || providerModels.gemini;
      sel.innerHTML = list.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("");
    }
    async function safeJson(res) { try { return await res.json(); } catch { return { ok:false, error: await res.text() || `HTTP ${res.status}` }; } }
    function collectRefs(ep, scene) {
      const refs = [];
      if (scene.reframeOf) {
        const base = ep.scenes.find(s => s.id === scene.reframeOf);
        if (base?.imageUrl) {
          const m = base.imageUrl.match(/^data:([^;]+);base64,(.+)$/);
          if (m) refs.push({ label:`continuity:${base.id}`, mimeType:m[1], base64:m[2] });
        }
      }
      return refs;
    }
    async function testBackend() {
      if (location.protocol === "file:") return apiStatus("❌ Abre via http://localhost:8787, não file://.", "error");
      const btn = $("testBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> A testar...';
      apiStatus("A verificar backend...", "testing");
      try {
        const h = await fetch(`${backendUrl()}/health`, { headers: { Accept: "application/json" } });
        const health = await safeJson(h);
        if (!h.ok || health.ok === false) throw new Error(health.error || `HTTP ${h.status}`);
        if (!health.keyConfigured) return apiStatus("⚠️ Backend ativo, mas nenhuma chave configurada no .env.", "testing");
        apiStatus(`Backend ativo (${esc(provider())}). A fazer geração real de teste...`, "testing");
        const t = await fetch(`${backendUrl()}/test`, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ provider: provider(), model: model() }) });
        const test = await safeJson(t);
        if (!t.ok || test.ok === false) throw new Error(test.error || `HTTP ${t.status}`);
        apiStatus(`✅ OK. Fornecedor: ${esc(test.provider || provider())} · Modelo: ${esc(test.model)} · Bytes: ${Number(test.bytes).toLocaleString("pt-PT")}`, "success");
      } catch(e) {
        apiStatus("❌ " + esc(e.message), "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Testar backend";
      }
    }
    async function checkContext() {
      if (location.protocol === "file:") return $("contextStatus").innerHTML = '<div class="api-status error">Abre via backend.</div>';
      $("contextStatus").innerHTML = '<div class="api-status testing">A ler contexto...</div>';
      try {
        const res = await fetch(`${backendUrl()}/context/status`, { headers: { Accept: "application/json" } });
        const data = await safeJson(res);
        if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
        const chars = Object.entries(data.characters || {}).map(([k,v]) => `${k}: ${v ? "✅" : "❌"}`).join("<br>");
        const bgs = Object.entries(data.backgrounds || {}).map(([k,v]) => `${esc(k)}: ${v ? "✅" : "❌"}`).join("<br>");
        $("contextStatus").innerHTML = `<div class="api-status success"><strong>Personagens</strong><br>${chars}<br><br><strong>Backgrounds</strong><br>${bgs}</div>`;
      } catch(e) {
        $("contextStatus").innerHTML = `<div class="api-status error">❌ ${esc(e.message)}</div>`;
      }
    }
    async function generateImage() {
      if (location.protocol === "file:") return status("Para imagens, abre via http://localhost:8787.", "error");
      const ep = currentEpisode();
      if (!ep) return status("Gera um episódio primeiro.", "error");
      const scene = ep.scenes.find(s => s.id === state.currentScene);
      if (!scene) return status("Seleciona um take.", "error");
      if (!ep.scriptApproved && !confirm("O guião ainda não foi aprovado. Gerar imagem mesmo assim?")) return;
      if ((scene.sv || 1) !== (ep.storyVersion || 1) && !confirm(`Este take é da história v${scene.sv || 1} e o episódio vai na v${ep.storyVersion || 1}. Gerar imagem mesmo assim?`)) return;
      const prompt = ($("promptInput")?.value || scene.imagePrompt || scene.prompt || "").trim();
      if (!prompt) return status("Prompt vazio.", "error");
      if (scene.approved && !confirm("Este plano está marcado como feito. Substituir a imagem?")) return;
      const btn = $("generateImageBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> A gerar...';
      try {
        const refs = collectRefs(ep, scene);
        const res = await fetch(`${backendUrl()}/generate-image`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt,
            provider: provider(),
            model: model(),
            references: refs,
            sceneContext: { characters: scene.characters || [], location: scene.location || "" }
          })
        });
        const data = await safeJson(res);
        if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
        if (!data.base64) throw new Error("Backend não devolveu imagem.");
        scene.imageUrl = `data:${data.mimeType || "image/png"};base64,${data.base64}`;
        scene.prompt = prompt;
        scene.model = data.model || model();
        scene.variant = Number(scene.variant || 0) + 1;
        scene.approved = false;
        scene.referenceCount = Number(data.referenceCount || refs.length || 0);
        save();
        renderPipeline();
        updateVideoTab();
        status(`Imagem gerada com ${scene.model}.`, "success");
        if (Array.isArray(data.warnings) && data.warnings.length) status(data.warnings.join(" | "), "info");
      } catch(e) {
        status("Erro: " + e.message, "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Gerar imagem";
      }
    }
    // Export/import de episódios (recuperação; F0). Formato versionado, validação
    // explícita, nunca apaga sem confirmação.
    function exportState() {
      try {
        const payload = { app: "os-lesados", format: 1, exportedAt: new Date().toISOString(), state };
        const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `os-lesados-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        status("Backup exportado.", "success");
      } catch (e) { status("Falha ao exportar: " + e.message, "error"); }
    }
    function validateImported(data) {
      if (!data || typeof data !== "object") return "ficheiro inválido (não é objeto)";
      const st = data.state || data;
      if (!Array.isArray(st.seasons)) return "sem temporadas válidas";
      for (const s of st.seasons) {
        if (!Array.isArray(s.episodes)) return "temporada sem episódios válidos";
        for (const ep of s.episodes) {
          if (!ep || typeof ep.id !== "string" || !Array.isArray(ep.scenes)) return "episódio inválido (id/scenes)";
        }
      }
      return null;
    }
    function importStateFile(file) {
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const data = JSON.parse(rd.result);
          const problem = validateImported(data);
          if (problem) return status("Importação recusada: " + problem + ". Nada foi alterado.", "error");
          if (!confirm("Substituir TODOS os episódios atuais pelo backup?")) return;
          state = data.state || data;
          save();
          normalize();
          renderHeaderNav();
          refreshAll();
          status("Backup importado e validado.", "success");
        } catch (e) { status("Importação recusada: ficheiro ilegível. Nada foi alterado.", "error"); }
      };
      rd.onerror = () => status("Falha a ler o ficheiro.", "error");
      rd.readAsText(file);
    }
    function resetAll() {      if (!confirm("Apagar tudo?")) return;
      localStorage.removeItem("osLesados_html");
      state = { version: VERSION, seasons: [], currentSeason: null, currentEpisode: null, currentScene: null };
      $("scriptContent").innerHTML = '<div class="empty"><h3>Guião</h3><p>Gera um episódio.</p></div>';
      $("pipelineContent").innerHTML = '<div class="empty"><h3>Pipeline</h3><p>Gera um episódio.</p></div>';
      $("videoContent").innerHTML = "";
      updateVideoTab();
      renderHeaderNav();
      $("audit").innerHTML = "";
      $("apiStatus").innerHTML = "";
      $("contextStatus").innerHTML = "";
      status("Tudo apagado.", "success");
    }

    document.addEventListener("DOMContentLoaded", () => {
      load();
      loadRepoEpisodes();
      renderCanon();
      suggestion();
      updateVideoTab();
      renderHeaderNav();
      $("suggestBtn").addEventListener("click", suggestion);
      $("aiGenerateBtn").addEventListener("click", aiGenerateEpisode);
      $("testBtn").addEventListener("click", testBackend);
      $("contextBtn").addEventListener("click", checkContext);
      $("providerSelect").addEventListener("change", syncModelOptions);
      syncModelOptions();
      $("aiStoryBtn").addEventListener("click", expandWithAI);
      $("resetBtn").addEventListener("click", resetAll);
      $("exportBtn").addEventListener("click", exportState);
      $("importBtn").addEventListener("click", () => $("importFile").click());
      $("importFile").addEventListener("change", ev => {
        if (ev.target.files && ev.target.files[0]) importStateFile(ev.target.files[0]);
        ev.target.value = "";
      });
      loadBible();
      document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));
      if (state.seasons.length && state.currentEpisode) {
        const ep = currentEpisode();
        if (ep) {
          renderAudit(ep.audit);
          renderScript();
          renderPipeline();
        }
      }
    });
  </script>
</body>
</html>
